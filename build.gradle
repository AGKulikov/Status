String getVersionName() {
    def envVersion = System.getenv('VERSION_NAME')
    if (envVersion) {
        return envVersion
    }

    logger.warn('Environment variable `VERSION_NAME` was not set, using default version')

    // Keep the frozen default identity reproducible. New release workflows always pass their
    // explicit VERSION_NAME/VERSION_CODE pair instead of mutating an older public baseline.
    return '2.2.10'
}

int getVersionCode() {
    def explicitCode = System.getenv('VERSION_CODE')
    if (explicitCode) {
        return explicitCode.toInteger()
    }
    def version = getVersionName()
    // Every public release gets a distinct versionName. 2.2.11 arms media before the shared boot
    // lane and coalesces repeated ECARX QuickBoot events instead of restarting the user delay.
    if (version == '2.2.5') {
        return 208021239
    }
    if (version == '2.2.6') {
        return 208021240
    }
    if (version == '2.2.7') {
        return 208021241
    }
    if (version == '2.2.8') {
        return 208021242
    }
    if (version == '2.2.9') {
        return 208021243
    }
    if (version == '2.2.10') {
        return 208021244
    }
    if (version == '2.2.11') {
        return 208021245
    }
    if (version == '2.2.12') {
        return 208021246
    }
    if (version == '2.2.13') {
        return 208021247
    }
    if (version == '2.2.15') {
        return 208021249
    }
    if (version == '2.2.16') {
        return 208021250
    }
    if (version == '2.2.17') {
        return 208021251
    }
    if (version == '2.2.18') {
        return 208021252
    }
    if (version == '2.2.19') {
        return 208021253
    }
    if (version == '2.3.1') {
        return 208021255
    }
    if (version == '2.3.2') {
        return 208021256
    }
    if (version == '2.3.3') {
        return 208021257
    }
    if (version == '2.3.4') {
        return 208021258
    }
    if (version == '2.3.5') {
        return 208021259
    }
    if (version == '2.3.6') {
        return 208021260
    }
    if (version == '2.3.0') {
        return 208021254
    }
    if (version == '2.2.14') {
        return 208021248
    }
    // Preserve the immutable 2.2.4-r3 build identity for exact release replay.
    if (version == '2.2.4') {
        return 208021238
    }
    // Active exact-owner ANCS recovery and strict ATT serialization follow the frozen 2.2.2
    // panel interaction release.
    if (version == '2.2.3') {
        return 208021235
    }
    // Per-information-tile typography, per-Favorites inactivity timers and stock long-press
    // click feedback follow the frozen 2.2.1 reconnect/HWGPS release.
    if (version == '2.2.2') {
        return 208021234
    }
    // Automatic iPhone reconnect and direct HWGPS DR state follow the frozen 2.2.0 release.
    if (version == '2.2.1') {
        return 208021233
    }
    // Preserve the original Helper 53 Bluetooth car-control release byte-for-byte reproducibly.
    if (version == '2.2.0') {
        return 208021232
    }
    // Preserve the previous public source-native identity for exact release replay.
    if (version == '2.1.4') {
        return 208021231
    }
    // Keep the last source-native public identity reproducible for its frozen/manual gate.
    if (version == '2.0.3') {
        return 208021220
    }
    // Keep the immediately previous public identities reproducible for their frozen/manual gates.
    if (version == '2.0.2') {
        return 208021219
    }
    if (version == '2.0.1') {
        return 208021218
    }
    def matcher = version =~ /^v?(\d+)\.(\d+)\.(\d+)(?:-ha(\d+))?$/
    if (!matcher.matches()) {
        throw new GradleException("Unsupported VERSION_NAME: ${version}")
    }
    def major = matcher.group(1).toInteger()
    def minor = matcher.group(2).toInteger()
    def patch = matcher.group(3).toInteger()
    def revision = matcher.group(4) ? matcher.group(4).toInteger() : 1

    // Reserve four decimal digits for CI revisions while remaining below Android's signed-int
    // limit. v2.8.2-ha1 -> 208020001; each Actions run supplies a larger explicit VERSION_CODE.
    return major * 100000000 + minor * 1000000 + patch * 10000 + revision
}

ext {
    appVersionName = getVersionName()
    appVersionCode = getVersionCode()

    println "Building version: ${appVersionName} (${appVersionCode})"
}

buildscript {
    repositories {
        if (System.getenv('STATUS_WIDGET_LOCAL_MAVEN')) {
            maven { url uri(System.getenv('STATUS_WIDGET_LOCAL_MAVEN')) }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.kotlin.gradle.plugin
    }
}

allprojects {
    repositories {
        if (System.getenv('STATUS_WIDGET_LOCAL_MAVEN')) {
            maven { url uri(System.getenv('STATUS_WIDGET_LOCAL_MAVEN')) }
        }
        google()
        mavenCentral()
    }

    // Add dependency constraints for all projects
    configurations.configureEach {
        resolutionStrategy {
            // Force specific Kotlin versions
            force libs.kotlin.stdlib
            force libs.kotlin.stdlib.common
            force libs.kotlin.stdlib.jdk8
            // ProfileInstaller calls ResolvableFuture on Android 9, but the class is optional in
            // its dependency metadata. Keep one concrete runtime version in every APK.
            force 'androidx.concurrent:concurrent-futures:1.3.0'

            // Fail on version conflict
            failOnVersionConflict()

            // Prefer modules that are part of this build (multi-project or composite build)
            preferProjectModules()
        }
    }
}
