name: Publish HA1217 Natro release 2.0

on:
  push:
    tags:
      - 'natro-v2.0'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Exact natro-v2.0 tag or the full 40-character SHA it points to'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-ha1217-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: 'natro-v2.0'
  VERSION_NAME: '2.0'
  VERSION_CODE: '208021217'
  PACKAGE_NAME: 'ru.natro.statuswidget'
  MIN_SDK: '28'
  TARGET_SDK: '28'
  HELPER_VERSION: '50.0'
  HELPER_BUILD: '50'
  HELPER_BUNDLE_ID: 'ru.natro.kx11ancshelper'
  HELPER_TREE: 'a42ef8e44e8f374ec32a18ab373f96527b020e82'
  STABLE_CERT_SHA256: '6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75'
  BUILD_TOOLS_VERSION: '36.0.0'

jobs:
  build-verify:
    name: Test and build exact unsigned Natro 2.0 bytes
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      handoff_artifact: ${{ steps.handoff.outputs.artifact_name }}
      unsigned_apk_sha256: ${{ steps.unsigned.outputs.apk_sha256 }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
      source_short: ${{ steps.identity.outputs.source_short }}
      tag_object: ${{ steps.identity.outputs.tag_object }}

    steps:
      - name: Checkout requested tag or full SHA without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Require exact immutable release tag and source commit
        id: identity
        shell: bash
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/${RELEASE_TAG}"
          case "$REQUESTED_REF" in
            "$RELEASE_TAG"|"$TAG_REF") ;;
            *)
              [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'release_ref must be natro-v2.0 or its full lowercase commit SHA' >&2
                exit 1
              }
              ;;
          esac
          git show-ref --verify --quiet "$TAG_REF" || {
            echo "Required tag $TAG_REF does not exist" >&2
            exit 1
          }
          SOURCE_SHA=$(git rev-parse 'HEAD^{commit}')
          REQUESTED_SHA=$(git rev-parse "${REQUESTED_REF}^{commit}")
          TAG_SHA=$(git rev-parse "${TAG_REF}^{commit}")
          test "$SOURCE_SHA" = "$REQUESTED_SHA"
          test "$SOURCE_SHA" = "$TAG_SHA"
          if test "$GITHUB_EVENT_NAME" = 'push'; then
            test "$GITHUB_REF" = "$TAG_REF"
            test "$(git rev-parse "${GITHUB_SHA}^{commit}")" = "$SOURCE_SHA"
          fi
          test -z "$(git status --short --ignore-submodules=none)"
          SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')
          TAG_OBJECT=$(git rev-parse "$TAG_REF")
          HELPER_ACTUAL_TREE=$(git rev-parse \
            "${SOURCE_SHA}:ios/KX11-iPhone-ANCS-Helper-v50")
          test "$HELPER_ACTUAL_TREE" = "$HELPER_TREE"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "source_short=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag_object=$TAG_OBJECT" >> "$GITHUB_OUTPUT"

      - name: Verify frozen Android and Helper identities
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "return '2.0'" build.gradle
          grep -Fq 'return 208021217' build.gradle
          grep -Fq 'Android version: `2.0`' release-manifests/HA1217.md
          grep -Fq 'Android version code: `208021217`' release-manifests/HA1217.md
          grep -Fq 'Package: `ru.natro.statuswidget`' release-manifests/HA1217.md
          grep -Fq 'Release tag: `natro-v2.0`' release-manifests/HA1217.md
          PROJECT=ios/KX11-iPhone-ANCS-Helper-v50/KX11ANCSHelper.xcodeproj/project.pbxproj
          test "$(grep -Fc 'CURRENT_PROJECT_VERSION = 50;' "$PROJECT")" -eq 2
          test "$(grep -Fc 'MARKETING_VERSION = 50.0;' "$PROJECT")" -eq 2
          test "$(grep -Fc \
            'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper;' "$PROJECT")" -eq 2

      - name: Verify exact Helper v50 portable contract
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          bash ios/KX11-iPhone-ANCS-Helper-v50/verify-v50-contract.sh
          test -z "$(git status --short --ignore-submodules=none)"

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install exact Android SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            'platforms;android-36' "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Run complete geelyDebug unit suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            clean testGeelyDebugUnitTest

      - name: Assemble and verify exact unsigned geelyRelease input
        id: unsigned
        shell: bash
        env:
          ALLOW_UNSIGNED_RELEASE: 'true'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            assembleGeelyRelease
          BUILT="app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}-release.apk"
          test -s "$BUILT"
          OUT="$RUNNER_TEMP/ha1217-unsigned-handoff"
          mkdir -p "$OUT"
          APK="$OUT/Natro-2.0-unsigned.apk"
          cp "$BUILT" "$APK"
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          if "$TOOLS/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo 'Gradle signing was not isolated: unsigned input already has a valid signature' >&2
            exit 1
          fi
          unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -Fx 'resources.arsc'
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'
          test "$(unzip -Z1 "$APK" | grep -c '^res/')" -gt 500
          "$TOOLS/aapt" dump resources "$APK" >/dev/null
          BADGING=$("$TOOLS/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F \
            "package: name='${PACKAGE_NAME}' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          LABELS=$(printf '%s\n' "$BADGING" | grep '^application-label')
          printf '%s\n' "$LABELS" | grep -Fx "application-label:'Natro'"
          if printf '%s\n' "$LABELS" \
              | grep -Ev "^application-label(-[^:]+)?:'Natro'$"; then
            echo 'Every localized application label must be exactly Natro' >&2
            exit 1
          fi
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'${MIN_SDK}'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'${TARGET_SDK}'"
          if printf '%s\n' "$BADGING" | grep -Fq 'application-debuggable'; then
            echo 'Unsigned release input must not be debuggable' >&2
            exit 1
          fi
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "apk_sha256=$APK_SHA" >> "$GITHUB_OUTPUT"
          test -z "$(git status --short --untracked-files=no --ignore-submodules=none)"

      - name: Package source and immutable unsigned handoff
        id: handoff
        shell: bash
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          SOURCE_SHORT: ${{ steps.identity.outputs.source_short }}
          TAG_OBJECT: ${{ steps.identity.outputs.tag_object }}
          UNSIGNED_APK_SHA256: ${{ steps.unsigned.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ha1217-unsigned-handoff"
          TAG_REF="refs/tags/${RELEASE_TAG}"
          SOURCE_ARCHIVE='Natro-2.0-source.tar.gz'
          SOURCE_BUNDLE='Natro-2.0-source.bundle'
          HELPER_ARCHIVE='KX11-iPhone-ANCS-Helper-v50-source.zip'
          cp release-manifests/HA1217.md "$OUT/HA1217-release-notes.md"
          git archive --format=tar.gz --prefix='Natro-2.0-source/' \
            --output="$OUT/$SOURCE_ARCHIVE" "$SOURCE_SHA"
          git bundle create "$OUT/$SOURCE_BUNDLE" "$TAG_REF"
          git bundle verify "$OUT/$SOURCE_BUNDLE" >/dev/null
          git archive --format=zip \
            --prefix='KX11-iPhone-ANCS-Helper-v50/' \
            --output="$OUT/$HELPER_ARCHIVE" \
            "${SOURCE_SHA}:ios/KX11-iPhone-ANCS-Helper-v50"
          SOURCE_ARCHIVE_SHA=$(sha256sum "$OUT/$SOURCE_ARCHIVE" | awk '{print $1}')
          SOURCE_BUNDLE_SHA=$(sha256sum "$OUT/$SOURCE_BUNDLE" | awk '{print $1}')
          HELPER_ARCHIVE_SHA=$(sha256sum "$OUT/$HELPER_ARCHIVE" | awk '{print $1}')
          jq -n \
            --arg schema 'natro-unsigned-handoff/v1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg tagObjectSha "$TAG_OBJECT" \
            --arg requestedRef "$REQUESTED_REF" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg sourceArchiveSha256 "$SOURCE_ARCHIVE_SHA" \
            --arg sourceBundleSha256 "$SOURCE_BUNDLE_SHA" \
            --arg helperTree "$HELPER_TREE" \
            --arg helperArchiveSha256 "$HELPER_ARCHIVE_SHA" \
            --arg unsignedSha256 "$UNSIGNED_APK_SHA256" \
            '{schema: $schema, repository: $repository, tag: $tag,
              tagObjectSha: $tagObjectSha, requestedRef: $requestedRef,
              sourceSha: $sourceSha, sourceTree: $sourceTree,
              sourceArchiveSha256: $sourceArchiveSha256,
              sourceBundleSha256: $sourceBundleSha256,
              helperTree: $helperTree, helperArchiveSha256: $helperArchiveSha256,
              unsignedApk: "Natro-2.0-unsigned.apk",
              unsignedApkSha256: $unsignedSha256}' \
            > "$OUT/HA1217-unsigned-handoff.json"
          (
            cd "$OUT"
            sha256sum \
              Natro-2.0-unsigned.apk \
              "$SOURCE_ARCHIVE" \
              "$SOURCE_BUNDLE" \
              "$HELPER_ARCHIVE" \
              HA1217-release-notes.md \
              HA1217-unsigned-handoff.json \
              > HA1217-unsigned-SHA256SUMS.txt
            sha256sum -c HA1217-unsigned-SHA256SUMS.txt
          )
          test -z "$(find "$OUT" -maxdepth 1 -type f \
            \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' \) -print)"
          echo "artifact_name=ha1217-unsigned-handoff-${SOURCE_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable unsigned handoff without signing secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: ${{ runner.temp }}/ha1217-unsigned-handoff/*
          if-no-files-found: error
          retention-days: 1

  sign-verify:
    name: Sign exact handoff on a clean runner without repository code
    needs: build-verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      apk_name: ${{ steps.package.outputs.apk_name }}
      apk_sha256: ${{ steps.package.outputs.apk_sha256 }}
      unsigned_apk_sha256: ${{ needs.build-verify.outputs.unsigned_apk_sha256 }}
      source_sha: ${{ needs.build-verify.outputs.source_sha }}
      source_tree: ${{ needs.build-verify.outputs.source_tree }}
      tag_object: ${{ needs.build-verify.outputs.tag_object }}

    steps:
      - name: Download exact unsigned handoff on the clean runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-verify.outputs.handoff_artifact }}
          path: ${{ runner.temp }}/ha1217-unsigned-handoff

      - name: Verify handoff before any signing secret is exposed
        shell: bash
        env:
          UNSIGNED_APK_SHA256: ${{ needs.build-verify.outputs.unsigned_apk_sha256 }}
          SOURCE_SHA: ${{ needs.build-verify.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.build-verify.outputs.source_tree }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ha1217-unsigned-handoff"
          APK="$OUT/Natro-2.0-unsigned.apk"
          test -s "$APK"
          (cd "$OUT" && sha256sum -c HA1217-unsigned-SHA256SUMS.txt)
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$UNSIGNED_APK_SHA256"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg helperTree "$HELPER_TREE" \
            --arg unsignedSha "$UNSIGNED_APK_SHA256" \
            '.tag == $tag and .sourceSha == $sourceSha
              and .sourceTree == $sourceTree and .helperTree == $helperTree
              and .unsignedApk == "Natro-2.0-unsigned.apk"
              and .unsignedApkSha256 == $unsignedSha' \
            "$OUT/HA1217-unsigned-handoff.json" >/dev/null
          test -z "$(find "$OUT" -maxdepth 1 -type f \
            \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' \) -print)"
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "build-tools;${BUILD_TOOLS_VERSION}"
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          test -x "$TOOLS/apksigner"
          test -x "$TOOLS/aapt"
          test -x "$TOOLS/zipalign"
          if "$TOOLS/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo 'Unsigned handoff unexpectedly contains a valid signature' >&2
            exit 1
          fi
          BADGING=$("$TOOLS/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F \
            "package: name='${PACKAGE_NAME}' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          printf '%s\n' "$BADGING" | grep -Fx "application-label:'Natro'"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" >/dev/null

      - name: Sign only the verified handoff with the stable update keystore
        id: sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEY_PASSWORD KEY_ALIAS; do
            test -n "${!required:-}" || {
              echo "::error::Required stable signing secret $required is not configured"
              exit 1
            }
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/ha1217-stable-keystore.jks"
          trap 'shred -u -- "$KEYSTORE" 2>/dev/null || true' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          KEYTOOL=$(command -v keytool)
          test -x "$KEYTOOL"
          KEYTOOL_OUTPUT=$("$KEYTOOL" -J-Duser.language=en -J-Duser.country=US \
            -list -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
            -storepass:env KEY_PASSWORD)
          KEYSTORE_CERT=$(printf '%s\n' "$KEYTOOL_OUTPUT" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | tr -d ':\r' | tr 'A-F' 'a-f' | head -n 1)
          test "$KEYSTORE_CERT" = "$STABLE_CERT_SHA256" || {
            echo 'Configured keystore certificate is not the stable update certificate' >&2
            exit 1
          }
          HANDOFF="$RUNNER_TEMP/ha1217-unsigned-handoff/Natro-2.0-unsigned.apk"
          FINAL="$RUNNER_TEMP/ha1217-release"
          mkdir -p "$FINAL"
          APK_NAME='Natro-2.0-signed.apk'
          SIGNED="$FINAL/$APK_NAME"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --min-sdk-version "$MIN_SDK" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$HANDOFF"
          test -s "$SIGNED"
          echo "apk=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK identity, resources, alignment and certificate
        id: apk
        shell: bash
        env:
          SIGNED_APK: ${{ steps.sign.outputs.apk }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          test -s "$SIGNED_APK"
          unzip -Z1 "$SIGNED_APK" | grep -Fx 'AndroidManifest.xml'
          unzip -Z1 "$SIGNED_APK" | grep -Fx 'resources.arsc'
          unzip -Z1 "$SIGNED_APK" | grep -Fx 'classes.dex'
          test "$(unzip -Z1 "$SIGNED_APK" | grep -c '^res/')" -gt 500
          "$TOOLS/aapt" dump resources "$SIGNED_APK" >/dev/null
          BADGING=$("$TOOLS/aapt" dump badging "$SIGNED_APK")
          printf '%s\n' "$BADGING" | grep -F \
            "package: name='${PACKAGE_NAME}' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          LABELS=$(printf '%s\n' "$BADGING" | grep '^application-label')
          printf '%s\n' "$LABELS" | grep -Fx "application-label:'Natro'"
          if printf '%s\n' "$LABELS" \
              | grep -Ev "^application-label(-[^:]+)?:'Natro'$"; then
            echo 'Every localized application label must be exactly Natro' >&2
            exit 1
          fi
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'${MIN_SDK}'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'${TARGET_SDK}'"
          if printf '%s\n' "$BADGING" | grep -Fq 'application-debuggable'; then
            echo 'Signed release APK must not be debuggable' >&2
            exit 1
          fi
          "$TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED_APK" >/dev/null
          REPORT="$RUNNER_TEMP/ha1217-release/apk-certificates.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs \
            --min-sdk-version 24 "$SIGNED_APK" | tee "$REPORT"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$REPORT"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$REPORT"
          grep -Fq 'Number of signers: 1' "$REPORT"
          grep -Fq \
            "Signer #1 certificate SHA-256 digest: ${STABLE_CERT_SHA256}" \
            "$REPORT"
          echo "apk_sha256=$(sha256sum "$SIGNED_APK" | awk '{print $1}')" \
            >> "$GITHUB_OUTPUT"

      - name: Package exact signed payload and provenance
        id: package
        shell: bash
        env:
          APK_NAME: ${{ steps.sign.outputs.apk_name }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          UNSIGNED_APK_SHA256: ${{ needs.build-verify.outputs.unsigned_apk_sha256 }}
          SOURCE_SHA: ${{ needs.build-verify.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.build-verify.outputs.source_tree }}
          SOURCE_SHORT: ${{ needs.build-verify.outputs.source_short }}
          TAG_OBJECT: ${{ needs.build-verify.outputs.tag_object }}
        run: |
          set -euo pipefail
          HANDOFF="$RUNNER_TEMP/ha1217-unsigned-handoff"
          OUT="$RUNNER_TEMP/ha1217-release"
          SOURCE_ARCHIVE='Natro-2.0-source.tar.gz'
          SOURCE_BUNDLE='Natro-2.0-source.bundle'
          HELPER_ARCHIVE='KX11-iPhone-ANCS-Helper-v50-source.zip'
          cp "$HANDOFF/$SOURCE_ARCHIVE" "$OUT/$SOURCE_ARCHIVE"
          cp "$HANDOFF/$SOURCE_BUNDLE" "$OUT/$SOURCE_BUNDLE"
          cp "$HANDOFF/$HELPER_ARCHIVE" "$OUT/$HELPER_ARCHIVE"
          cp "$HANDOFF/HA1217-release-notes.md" "$OUT/HA1217-release-notes.md"
          SOURCE_ARCHIVE_SHA=$(sha256sum "$OUT/$SOURCE_ARCHIVE" | awk '{print $1}')
          SOURCE_BUNDLE_SHA=$(sha256sum "$OUT/$SOURCE_BUNDLE" | awk '{print $1}')
          HELPER_ARCHIVE_SHA=$(sha256sum "$OUT/$HELPER_ARCHIVE" | awk '{print $1}')
          jq -e \
            --arg sourceArchiveSha "$SOURCE_ARCHIVE_SHA" \
            --arg sourceBundleSha "$SOURCE_BUNDLE_SHA" \
            --arg helperArchiveSha "$HELPER_ARCHIVE_SHA" \
            '.sourceArchiveSha256 == $sourceArchiveSha
              and .sourceBundleSha256 == $sourceBundleSha
              and .helperArchiveSha256 == $helperArchiveSha' \
            "$HANDOFF/HA1217-unsigned-handoff.json" >/dev/null
          jq -n \
            --arg schema 'natro-release-provenance/v1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg tagObjectSha "$TAG_OBJECT" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg sourceArchiveSha256 "$SOURCE_ARCHIVE_SHA" \
            --arg sourceBundleSha256 "$SOURCE_BUNDLE_SHA" \
            --arg helperTree "$HELPER_TREE" \
            --arg helperVersion "$HELPER_VERSION" \
            --arg helperBundleId "$HELPER_BUNDLE_ID" \
            --arg helperArchiveSha256 "$HELPER_ARCHIVE_SHA" \
            --arg packageName "$PACKAGE_NAME" \
            --arg versionName "$VERSION_NAME" \
            --arg signedApk "$APK_NAME" \
            --arg signedApkSha256 "$APK_SHA256" \
            --arg unsignedApkSha256 "$UNSIGNED_APK_SHA256" \
            --arg signingCertificateSha256 "$STABLE_CERT_SHA256" \
            --arg buildTools "$BUILD_TOOLS_VERSION" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg actor "$GITHUB_ACTOR" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson helperBuild "$HELPER_BUILD" \
            --argjson minSdk "$MIN_SDK" \
            --argjson targetSdk "$TARGET_SDK" \
            '{schema: $schema, repository: $repository, tag: $tag,
              tagObjectSha: $tagObjectSha, sourceSha: $sourceSha,
              sourceTree: $sourceTree,
              sourceArchiveSha256: $sourceArchiveSha256,
              sourceBundleSha256: $sourceBundleSha256,
              helper: {version: $helperVersion, build: $helperBuild,
                bundleId: $helperBundleId, tree: $helperTree,
                sourceArchiveSha256: $helperArchiveSha256},
              android: {appName: "Natro", package: $packageName,
                versionName: $versionName, versionCode: $versionCode,
                minSdk: $minSdk, targetSdk: $targetSdk,
                flavor: "geely", buildType: "release", signed: true,
                apk: $signedApk, apkSha256: $signedApkSha256,
                unsignedInputSha256: $unsignedApkSha256,
                certificateSha256: $signingCertificateSha256,
                signatureSchemes: ["v2", "v3"]},
              validation: {unitTask: "testGeelyDebugUnitTest",
                helperContract: "verify-v50-contract.sh",
                buildTask: "assembleGeelyRelease", buildTools: $buildTools,
                signingRunnerCheckedOutRepository: false},
              github: {workflow: $workflow, workflowRef: $workflowRef,
                workflowSha: $workflowSha, runId: $runId,
                runAttempt: $runAttempt, actor: $actor}}' \
            > "$OUT/HA1217-provenance.json"
          (
            cd "$OUT"
            sha256sum \
              "$APK_NAME" \
              "$SOURCE_ARCHIVE" \
              "$SOURCE_BUNDLE" \
              "$HELPER_ARCHIVE" \
              HA1217-release-notes.md \
              HA1217-provenance.json \
              apk-certificates.txt \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          test ! -e "$OUT/Natro-2.0-unsigned.apk"
          test -z "$(find "$OUT" -maxdepth 1 -type f \
            \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' \) -print)"
          echo "artifact_name=ha1217-natro-signed-${SOURCE_SHORT}" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload exact signed release, source and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/ha1217-release/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish immutable Natro release 2.0 prerelease
    needs: sign-verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download exact verified release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign-verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/ha1217-release

      - name: Recheck checksums and provenance before publication
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.sign-verify.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.sign-verify.outputs.source_tree }}
          APK_NAME: ${{ needs.sign-verify.outputs.apk_name }}
          APK_SHA256: ${{ needs.sign-verify.outputs.apk_sha256 }}
          UNSIGNED_APK_SHA256: ${{ needs.sign-verify.outputs.unsigned_apk_sha256 }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ha1217-release"
          test -s "$OUT/$APK_NAME"
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          test "$(sha256sum "$OUT/$APK_NAME" | awk '{print $1}')" = "$APK_SHA256"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg apk "$APK_NAME" \
            --arg apkSha "$APK_SHA256" \
            --arg unsignedApkSha "$UNSIGNED_APK_SHA256" \
            --arg helperTree "$HELPER_TREE" \
            --arg cert "$STABLE_CERT_SHA256" \
            '.tag == $tag and .sourceSha == $sourceSha
              and .sourceTree == $sourceTree
              and .helper.tree == $helperTree
              and .android.appName == "Natro"
              and .android.versionName == "2.0"
              and .android.apk == $apk and .android.apkSha256 == $apkSha
              and .android.unsignedInputSha256 == $unsignedApkSha
              and .android.certificateSha256 == $cert
              and .android.signatureSchemes == ["v2", "v3"]
              and .validation.signingRunnerCheckedOutRepository == false' \
            "$OUT/HA1217-provenance.json" >/dev/null

      - name: Create one non-overwriting signed Natro prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.sign-verify.outputs.source_sha }}
          TAG_OBJECT: ${{ needs.sign-verify.outputs.tag_object }}
        run: |
          set -euo pipefail
          TAG_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          REMOTE_TAG_OBJECT=$(jq -r '.object.sha' <<<"$TAG_JSON")
          REMOTE_OBJECT_TYPE=$(jq -r '.object.type' <<<"$TAG_JSON")
          test "$REMOTE_TAG_OBJECT" = "$TAG_OBJECT" || {
            echo "Remote $RELEASE_TAG tag object moved after the verified build" >&2
            exit 1
          }
          REMOTE_OBJECT_SHA="$REMOTE_TAG_OBJECT"
          for _ in 1 2 3 4; do
            case "$REMOTE_OBJECT_TYPE" in
              commit) break ;;
              tag)
                TAG_JSON=$(gh api \
                  "repos/${GITHUB_REPOSITORY}/git/tags/${REMOTE_OBJECT_SHA}")
                REMOTE_OBJECT_SHA=$(jq -r '.object.sha' <<<"$TAG_JSON")
                REMOTE_OBJECT_TYPE=$(jq -r '.object.type' <<<"$TAG_JSON")
                ;;
              *)
                echo "Unsupported remote tag target type: $REMOTE_OBJECT_TYPE" >&2
                exit 1
                ;;
            esac
          done
          test "$REMOTE_OBJECT_TYPE" = commit
          test "$REMOTE_OBJECT_SHA" = "$SOURCE_SHA" || {
            echo "Remote $RELEASE_TAG no longer resolves to the signed source commit" >&2
            exit 1
          }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace signed assets" >&2
            exit 1
          fi
          OUT="$RUNNER_TEMP/ha1217-release"
          gh release create "$RELEASE_TAG" "$OUT"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$SOURCE_SHA" \
            --title 'Natro — signed release 2.0 + Helper v50' \
            --notes-file "$OUT/HA1217-release-notes.md" \
            --prerelease
