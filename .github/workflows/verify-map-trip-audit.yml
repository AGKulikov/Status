name: Verify map and trip source candidate without APK

on:
  push:
    branches: ['feature/natro-map-trip-audit-20260912']
    paths:
      - 'app/**'
      - 'navigator-mod/**'
      - 'tools/**'
      - 'build.gradle'
      - '.github/workflows/verify-map-trip-audit.yml'

permissions:
  contents: read

concurrency:
  group: map-trip-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      # Compile fixtures against the last published identity; no installable artifact is made.
      VERSION_NAME: '2.8.7'
      VERSION_CODE: '208021320'
      ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android compilation dependencies
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile Natro and execute all local unit tests
        run: ./gradlew testGeelyDebugUnitTest --no-daemon --max-workers=2
      - name: Compile all Navigator bridge Java sources
        shell: bash
        run: |
          set -euo pipefail
          git ls-files 'navigator-mod/src/main/java/*.java' > "$RUNNER_TEMP/navigator-java-sources.txt"
          test -s "$RUNNER_TEMP/navigator-java-sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d "$RUNNER_TEMP/navigator-java-classes" \
            @"$RUNNER_TEMP/navigator-java-sources.txt"
      - name: Execute tool and production-policy regression tests
        shell: bash
        run: |
          set -euo pipefail
          JSON_JAR=$(find "$HOME/.gradle/caches" -path '*/org.json/json/20240303/*/*.jar' -print -quit)
          test -s "$JSON_JAR"
          export JSON_JAR
          python3 -m unittest discover -s tools/tests -q
      - name: Verify no APK was produced
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find app/build -name '*.apk' -print -quit 2>/dev/null)"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: map-trip-unit-test-reports-${{ github.run_number }}
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
