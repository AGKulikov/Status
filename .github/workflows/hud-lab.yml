name: Build HUD Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'hudlab/**'
      - 'app/libs/geely/ecarx-adaptapi.jar'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/hud-lab.yml'
  pull_request:
    paths:
      - 'hudlab/**'
      - 'app/libs/geely/ecarx-adaptapi.jar'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/hud-lab.yml'

permissions:
  contents: read

concurrency:
  group: hud-lab-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Decode stable HA signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            touch .stable-ha-signing
          else
            echo "Stable key is unavailable to this PR; building an unsigned release handoff"
          fi

      - name: Build signed HUD Lab
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          chmod +x gradlew
          if [[ -f .stable-ha-signing ]]; then
            test -n "$KEY_PASSWORD" || {
              echo "KEY_PASSWORD is required with the stable keystore" >&2
              exit 1
            }
            ./gradlew --no-daemon :hudlab:clean \
              :hudlab:testDebugUnitTest :hudlab:assembleRelease
          else
            ALLOW_UNSIGNED_RELEASE=true \
              ./gradlew --no-daemon :hudlab:clean \
                :hudlab:testDebugUnitTest :hudlab:assembleRelease
          fi

      - name: Verify identity, layout and stable certificate
        shell: bash
        run: |
          APK="$(find hudlab/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -F \
            "package: name='dezz.status.hudlab10' versionCode='18' versionName='0.18'"
          echo "$BADGING" | grep -F "sdkVersion:'28'"
          echo "$BADGING" | grep -F "targetSdkVersion:'28'"
          if echo "$BADGING" | grep -Fq "application-debuggable"; then
            echo "HUD Lab release must not be debuggable" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          if [[ -f .stable-ha-signing ]]; then
            CERTS=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" \
              verify --verbose --print-certs "$APK")
            echo "$CERTS"
            echo "$CERTS" | grep -qi \
              "6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75"
          elif "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"; then
            echo "PR handoff unexpectedly contains a signature" >&2
            exit 1
          fi
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload signed HUD Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: hud-lab-0.18-release-candidate
          path: |
            hudlab/build/outputs/apk/release/*.apk
            hudlab/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 30
