name: Build Natro 2.4.3 and Navigator HUD v2 candidate

on:
  push:
    branches:
      - 'feature/navigation-hud-v2'
      - 'release/natro-2.4.3*'
      - 'release/natro-2.4.3-signing-handoff'
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      sign_pair:
        description: 'Sign the verified Natro and Navigator pair'
        required: true
        default: false
        type: boolean
      baseline_url:
        description: 'Short-lived private URL for the exact reviewed Navigator baseline'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android:
    if: >-
      github.ref != 'refs/heads/release/natro-2.4.3-signing-handoff' &&
      (github.event_name != 'workflow_dispatch' || !inputs.sign_pair)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION_NAME: '2.4.3'
      VERSION_CODE: '208021267'
      ALLOW_UNSIGNED_RELEASE: 'true'
      BUILD_TOOLS_VERSION: '36.0.0'
      APKTOOL_SHA256: 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install exact Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' "build-tools;${BUILD_TOOLS_VERSION}"
      - name: Unit tests and unsigned Natro release APK
        run: ./gradlew testGeelyDebugUnitTest assembleGeelyRelease --no-daemon
      - name: Verify Helper 70 active-data-SIM and release contract
        run: sh ios/KX11-iPhone-ANCS-Helper-v70-personal/verify-v70-personal-contract.sh
      - name: Compile isolated Navigator classes19.dex
        run: bash tools/build_navigation_patch_dex.sh build/navigation-mod-ci
      - name: Navigation APK baseline verifier self-tests
        run: |
          python3 -m py_compile \
            tools/verify_navigation_mod_baseline.py \
            tools/patch_navigation_map_activity.py \
            tools/repack_apk_entries.py
          python3 tools/tests/test_verify_navigation_mod_baseline.py
          python3 tools/tests/test_navigation_mod_tools.py
      - name: Fetch pinned Apktool used by the isolated classes4 rebuild
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/apktool_3.0.3.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          test "$(sha256sum "$RUNNER_TEMP/apktool_3.0.3.jar" | awk '{print $1}')" \
            = "$APKTOOL_SHA256"
      - name: Package unsigned pair and reproducible local toolchain
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/navigation-hud-v2-pair"
          mkdir -p "$OUT"
          NATRO=$(find app/build/outputs/apk/geely/release -name '*.apk' -print -quit)
          test -s "$NATRO"
          cp "$NATRO" "$OUT/Natro-${VERSION_NAME}-unsigned-release.apk"
          cp build/navigation-mod-ci/classes19.dex "$OUT/classes19.dex"
          cp "$RUNNER_TEMP/apktool_3.0.3.jar" "$OUT/apktool_3.0.3.jar"
          tar -C "$ANDROID_HOME/build-tools" -czf \
            "$OUT/android-build-tools-${BUILD_TOOLS_VERSION}.tar.gz" \
            "$BUILD_TOOLS_VERSION"
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          if "$TOOLS/apksigner" verify \
              "$OUT/Natro-${VERSION_NAME}-unsigned-release.apk" >/dev/null 2>&1; then
            echo 'Natro candidate unexpectedly contains a valid signature' >&2
            exit 1
          fi
          "$TOOLS/zipalign" -c -P 16 -v 4 \
            "$OUT/Natro-${VERSION_NAME}-unsigned-release.apk" >/dev/null
          BADGING=$("$TOOLS/aapt" dump badging \
            "$OUT/Natro-${VERSION_NAME}-unsigned-release.apk")
          printf '%s\n' "$BADGING" | grep -F \
            "package: name='ru.natro.statuswidget' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          printf '%s\n' "$BADGING" | grep -Fx "application-label:'Natro'"
          printf '%s\n' "$BADGING" | grep -Fx "sdkVersion:'28'"
          printf '%s\n' "$BADGING" | grep -Fx "targetSdkVersion:'28'"
          if printf '%s\n' "$BADGING" | grep -F "application-debuggable"; then
            echo 'Natro release candidate must not be debuggable' >&2
            exit 1
          fi
          if unzip -Z1 "$OUT/Natro-${VERSION_NAME}-unsigned-release.apk" \
              | grep -E '^lib/[^/]+/'; then
            echo 'Natro must remain ABI-neutral for the Android 9 KX11 build' >&2
            exit 1
          fi
          jq -n \
            --arg schema 'natro-navigation-hud-v2-candidate/v1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg sourceTree "$(git rev-parse 'HEAD^{tree}')" \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apktoolSha256 "$APKTOOL_SHA256" \
            --arg buildTools "$BUILD_TOOLS_VERSION" \
            '{schema: $schema, repository: $repository, sourceSha: $sourceSha,
              sourceTree: $sourceTree, natro: {versionName: $versionName,
              versionCode: $versionCode, unsigned: true}, navigator: {
              baselineSha256: "663018fb66074e001eed7caba8e33bee1bcf78f6798bc84949d253dcb348f27f",
              patchDex: "classes19.dex"}, toolchain: {apktoolSha256: $apktoolSha256,
              androidBuildTools: $buildTools}}' > "$OUT/candidate.json"
          (
            cd "$OUT"
            sha256sum \
              "Natro-${VERSION_NAME}-unsigned-release.apk" \
              classes19.dex apktool_3.0.3.jar \
              "android-build-tools-${BUILD_TOOLS_VERSION}.tar.gz" \
              candidate.json > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned pair candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: navigation-hud-v2-pair-candidate-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.candidate.outputs.path }}/*

  sign-pair:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.sign_pair) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/release/natro-2.4.3-signing-handoff')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      EXPECTED_SOURCE_SHA: '8bd51c07deb32cb7ebfde8ea95e9906f39684531'
      EXPECTED_SOURCE_TREE: '627a2d8e8215b3b4b4a415fc18c992f0a7d6fd4d'
      EXPECTED_BASELINE_SHA256: '663018fb66074e001eed7caba8e33bee1bcf78f6798bc84949d253dcb348f27f'
      EXPECTED_CERT_SHA256: '6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75'
      BASELINE_URL_KEY_B64: ''
      BASELINE_URL_IV_B64: 'M0ZjRz6UE/A6InrJyKWakQ=='
      BASELINE_URL_CIPHERTEXT_B64: ''
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Download the exact successful release-branch candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: navigation-hud-v2-pair-candidate-43
          path: ${{ runner.temp }}/candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: AGKulikov/Status
          run-id: '33093255197'
      - name: Verify immutable source and unsigned handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          CANDIDATE="$RUNNER_TEMP/candidate"
          (cd "$CANDIDATE" && sha256sum -c SHA256SUMS.txt)
          test "$(jq -er '.sourceSha' "$CANDIDATE/candidate.json")" = \
            "$EXPECTED_SOURCE_SHA"
          test "$(jq -er '.sourceTree' "$CANDIDATE/candidate.json")" = \
            "$EXPECTED_SOURCE_TREE"
          test "$(jq -er '.natro.versionName' "$CANDIDATE/candidate.json")" = '2.4.3'
          test "$(jq -er '.natro.versionCode' "$CANDIDATE/candidate.json")" = '208021267'
      - name: Fetch and verify the exact private Navigator baseline
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BASELINE_URL: ${{ inputs.baseline_url }}
        run: |
          set -euo pipefail
          test -n "$BASELINE_URL"
          echo "::add-mask::$BASELINE_URL"
          BASELINE="$RUNNER_TEMP/YN_30.3.0_T2_.apk"
          curl --fail --location --retry 5 --retry-all-errors \
            --silent --show-error --output "$BASELINE" "$BASELINE_URL"
          test "$(sha256sum "$BASELINE" | awk '{print $1}')" = \
            "$EXPECTED_BASELINE_SHA256"
      - name: Receive the exact encrypted signing bundle when secrets are unavailable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_BUNDLE_SHA256: '4fb34ee8aed62dad3896d7aa6240d4066ec9b6ef3da5459bca9d7d1c4c3b7fc0'
        run: |
          set -euo pipefail
          configured=0
          for required in KEYSTORE_BASE64 KEY_PASSWORD KEY_ALIAS; do
            test -z "${!required:-}" || configured=$((configured + 1))
          done
          case "$configured" in
            3)
              echo 'Complete GitHub Actions signing secrets are configured'
              exit 0
              ;;
            0) ;;
            *)
              echo 'Signing credentials must be supplied completely or omitted completely' >&2
              exit 1
              ;;
          esac
          unset KEYSTORE_BASE64 KEY_PASSWORD KEY_ALIAS
          umask 077
          TRANSPORT="$RUNNER_TEMP/natro243-signing-transport"
          SIGNING="$RUNNER_TEMP/natro243-signing"
          mkdir -p "$TRANSPORT/chunks" "$SIGNING"
          PRIVATE="$TRANSPORT/private.pem"
          PUBLIC="$TRANSPORT/public.pem"
          ENCRYPTED="$TRANSPORT/signing-url.enc"
          URL_FILE="$TRANSPORT/signing-url.txt"
          ARCHIVE="$TRANSPORT/signing-bundle.tar.gz"
          PREFIX="natro243-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PUBLIC_PATH="release-handoff/${PREFIX}.pub"
          ENCRYPTED_PATH="release-handoff/${PREFIX}.url.enc.b64"
          cleanup_transport() {
            find "$TRANSPORT/chunks" -type f -exec shred -u -- {} + \
              2>/dev/null || true
            shred -u -- "$PRIVATE" "$PUBLIC" "$ENCRYPTED" "$URL_FILE" \
              "$ARCHIVE" "$TRANSPORT/encrypted.json" 2>/dev/null || true
          }
          trap cleanup_transport EXIT HUP INT TERM
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out "$PRIVATE" 2>/dev/null
          openssl pkey -in "$PRIVATE" -pubout -out "$PUBLIC"
          PUBLIC_CONTENT=$(base64 -w0 "$PUBLIC")
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${PUBLIC_PATH}" \
            -f message="ci: publish ephemeral Natro 2.4.3 transport key [skip ci]" \
            -f content="$PUBLIC_CONTENT" \
            -f branch="$GITHUB_REF_NAME" >/dev/null
          echo "::notice title=Natro 2.4.3 encrypted handoff::Waiting for ${ENCRYPTED_PATH}"
          for _ in $(seq 1 180); do
            if gh api \
                "repos/${GITHUB_REPOSITORY}/contents/${ENCRYPTED_PATH}?ref=${GITHUB_REF_NAME}" \
                > "$TRANSPORT/encrypted.json" 2>/dev/null; then
              jq -r '.content' "$TRANSPORT/encrypted.json" \
                | tr -d '\n' | base64 --decode | base64 --decode > "$ENCRYPTED"
              break
            fi
            sleep 5
          done
          test -s "$ENCRYPTED" || {
            echo 'Timed out waiting for the encrypted signing URL handoff' >&2
            exit 1
          }
          test $(( $(stat -c '%s' "$ENCRYPTED") % 512 )) -eq 0
          split -b 512 -d -a 3 "$ENCRYPTED" "$TRANSPORT/chunks/chunk-"
          : > "$URL_FILE"
          for chunk in "$TRANSPORT"/chunks/chunk-*; do
            openssl pkeyutl -decrypt -inkey "$PRIVATE" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256 \
              -in "$chunk" >> "$URL_FILE"
          done
          SIGNING_URL=$(tr -d '\r\n' < "$URL_FILE")
          test -n "$SIGNING_URL"
          echo "::add-mask::$SIGNING_URL"
          curl --fail --location --retry 8 --retry-all-errors \
            --silent --show-error --output "$ARCHIVE" "$SIGNING_URL"
          test "$(sha256sum "$ARCHIVE" | awk '{print $1}')" = \
            "$SIGNING_BUNDLE_SHA256"
          tar -tzf "$ARCHIVE" | awk \
            'BEGIN { ok=1 } /^\// || /(^|\/)\.\.($|\/)/ { ok=0 } END { exit ok ? 0 : 1 }'
          tar -xzf "$ARCHIVE" -C "$SIGNING" \
            --no-same-owner --no-same-permissions
          chmod 600 "$SIGNING"/*
          test -s "$SIGNING/status-widget-ha-update.jks"
          test -s "$SIGNING/status-widget-ha-update.pass"
          IFS= read -r bundle_password < "$SIGNING/status-widget-ha-update.pass"
          test -n "$bundle_password"
          export bundle_password
          bundle_cert=$(keytool -J-Duser.language=en -J-Duser.country=US \
            -list -v -keystore "$SIGNING/status-widget-ha-update.jks" \
            -alias status-widget-ha -storepass:env bundle_password \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | tr -d ':\r' | tr 'A-F' 'a-f' | head -n 1)
          unset bundle_password
          test "$bundle_cert" = "$EXPECTED_CERT_SHA256"
          touch "$SIGNING/verified.ready"
      - name: Sign and fully verify Natro and Navigator
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          configured=0
          for required in KEYSTORE_BASE64 KEY_PASSWORD KEY_ALIAS; do
            test -z "${!required:-}" || configured=$((configured + 1))
          done
          CANDIDATE="$RUNNER_TEMP/candidate"
          BUILD_TOOLS_ROOT="$RUNNER_TEMP/android-build-tools"
          SIGNING="$RUNNER_TEMP/natro243-signing"
          KEYSTORE="$RUNNER_TEMP/stable-update-keystore.jks"
          PASSWORD_FILE=''
          PKCS12="$RUNNER_TEMP/stable-update-keystore.p12"
          PRIVATE_KEY="$RUNNER_TEMP/stable-update-private.pem"
          URL_KEY_ENCRYPTED="$RUNNER_TEMP/baseline-url.key.enc"
          URL_KEY="$RUNNER_TEMP/baseline-url.key"
          URL_IV="$RUNNER_TEMP/baseline-url.iv"
          URL_CIPHERTEXT="$RUNNER_TEMP/baseline-url.enc"
          URL_FILE="$RUNNER_TEMP/baseline-url.txt"
          BASELINE="$RUNNER_TEMP/YN_30.3.0_T2_.apk"
          OUTPUT="$RUNNER_TEMP/signed-pair"
          cleanup_files=("$KEYSTORE")
          cleanup() {
            shred -u -- "${cleanup_files[@]}" "$PKCS12" "$PRIVATE_KEY" \
              "$URL_KEY" "$URL_FILE" "$BASELINE" 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM
          case "$configured" in
            3)
              printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
              ;;
            0)
              test -f "$SIGNING/verified.ready"
              KEYSTORE="$SIGNING/status-widget-ha-update.jks"
              PASSWORD_FILE="$SIGNING/status-widget-ha-update.pass"
              cleanup_files=("$KEYSTORE" "$PASSWORD_FILE")
              IFS= read -r KEY_PASSWORD < "$PASSWORD_FILE"
              KEY_ALIAS='status-widget-ha'
              ;;
            *)
              echo 'Signing credentials must be supplied completely or omitted completely' >&2
              exit 1
              ;;
          esac
          export KEY_PASSWORD
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            printf '%s' "$BASELINE_URL_KEY_B64" | base64 --decode > "$URL_KEY_ENCRYPTED"
            printf '%s' "$BASELINE_URL_IV_B64" | base64 --decode > "$URL_IV"
            printf '%s' "$BASELINE_URL_CIPHERTEXT_B64" | base64 --decode > "$URL_CIPHERTEXT"
            keytool -importkeystore -noprompt \
              -srckeystore "$KEYSTORE" \
              -srcstorepass "$KEY_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -destkeystore "$PKCS12" \
              -deststoretype PKCS12 \
              -deststorepass "$KEY_PASSWORD" \
              -destkeypass "$KEY_PASSWORD"
            openssl pkcs12 -in "$PKCS12" -nodes -nocerts \
              -passin env:KEY_PASSWORD -out "$PRIVATE_KEY"
            openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -in "$URL_KEY_ENCRYPTED" -out "$URL_KEY"
            key_hex=$(od -An -tx1 "$URL_KEY" | tr -d ' \n')
            iv_hex=$(od -An -tx1 "$URL_IV" | tr -d ' \n')
            openssl enc -d -aes-256-ctr -K "$key_hex" -iv "$iv_hex" \
              -in "$URL_CIPHERTEXT" -out "$URL_FILE"
            BASELINE_URL=$(tr -d '\r\n' < "$URL_FILE")
            test -n "$BASELINE_URL"
            echo "::add-mask::$BASELINE_URL"
            curl --fail --location --retry 8 --retry-all-errors \
              --silent --show-error --output "$BASELINE" "$BASELINE_URL"
          fi
          test "$(sha256sum "$BASELINE" | awk '{print $1}')" = \
            "$EXPECTED_BASELINE_SHA256"
          mkdir -p "$BUILD_TOOLS_ROOT"
          tar -xzf "$CANDIDATE/android-build-tools-36.0.0.tar.gz" \
            -C "$BUILD_TOOLS_ROOT"
          KEYSTORE_FILE="$KEYSTORE" \
            KEY_PASSWORD="$KEY_PASSWORD" \
            KEY_ALIAS="$KEY_ALIAS" \
            bash tools/sign_navigation_hud_v2_pair.sh \
              "$BASELINE" \
              "$CANDIDATE" \
              "$BUILD_TOOLS_ROOT/36.0.0" \
              "$OUTPUT"
          test "$(jq -er '.source.commit' "$OUTPUT/release-report.json")" = \
            "$EXPECTED_SOURCE_SHA"
          test "$(jq -er '.source.tree' "$OUTPUT/release-report.json")" = \
            "$EXPECTED_SOURCE_TREE"
          test "$(jq -er '.certificateSha256' "$OUTPUT/release-report.json")" = \
            "$EXPECTED_CERT_SHA256"
      - name: Upload only the verified signed pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: navigation-hud-v2-signed-2.4.3-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/signed-pair/*
