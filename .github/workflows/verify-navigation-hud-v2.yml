name: Verify navigation HUD v2 branch

on:
  push:
    branches: ['feature/navigation-hud-v2']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION_NAME: '2.3.8'
      VERSION_CODE: '208021262'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Unit tests and debug APK
        run: ./gradlew testGeelyDebugUnitTest assembleGeelyDebug --no-daemon
      - name: Compile isolated Navigator classes19.dex
        run: bash tools/build_navigation_patch_dex.sh build/navigation-mod-ci
      - name: Navigation APK baseline verifier self-tests
        run: |
          python3 -m py_compile \
            tools/verify_navigation_mod_baseline.py \
            tools/patch_navigation_map_activity.py \
            tools/repack_apk_entries.py
          python3 tools/tests/test_verify_navigation_mod_baseline.py
          python3 tools/tests/test_navigation_mod_tools.py
