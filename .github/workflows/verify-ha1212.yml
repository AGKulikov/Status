name: Verify HA1212 ANCS transport v2 candidate

on:
  push:
    branches: ['work/ha1212-ancs-v2']
    paths:
      - 'app/**'
      - 'docs/ANCS_V2_REFERENCE_ARCHITECTURE.md'
      - 'docs/ancs-v2-wire-vectors.json'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - 'third_party/**'
      - 'release-manifests/HA1212.md'
      - '.github/workflows/verify-ha1212.yml'
  pull_request:
    branches: ['work/ha1211-physical-facade-ab']
    paths:
      - 'app/**'
      - 'docs/ANCS_V2_REFERENCE_ARCHITECTURE.md'
      - 'docs/ancs-v2-wire-vectors.json'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - 'third_party/**'
      - 'release-manifests/HA1212.md'
      - '.github/workflows/verify-ha1212.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Clean-room dual-route contracts and geelyRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack exact Android source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/status-ha1212-source.bundle" HEAD

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ha1212-ancs-v2-source-bundle
          path: ${{ runner.temp }}/status-ha1212-source.bundle
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Prove legacy ANCS production stack is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/java/dezz/status/widget/phone/transport/IphoneAncsTransport.java
          test ! -e app/src/main/java/dezz/status/widget/phone/transport/AncsRecoveryPolicy.java
          test ! -e app/src/main/java/dezz/status/widget/phone/transport/ManagedIncomingPublicationPolicy.java
          test ! -e app/src/main/java/dezz/status/widget/phone/transport/publicgatt
          if grep -REn \
            'IphoneAncsTransport|refreshGattCache|iPhone_ANCS|Geely_ANCS|phoneAncsDeviceAddress' \
            app/src/main/java/dezz/status/widget/phone/PhoneConnectorController.java \
            app/src/main/java/dezz/status/widget/PhoneConnectorSettingsActivity.java \
            app/src/main/java/dezz/status/widget/phone/transport/v2; then
            echo 'obsolete ANCS route/cache/name dependency remains in production' >&2
            exit 1
          fi

      - name: Clean-room transport, switch and preserved product contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            testGeelyDebugUnitTest \
            --tests 'dezz.status.widget.phone.transport.v2.*' \
            --tests 'dezz.status.widget.phone.transport.v2.android.*' \
            --tests 'dezz.status.widget.phone.transport.switching.*' \
            --tests dezz.status.widget.phone.PhoneConnectorSettingsContractTest \
            --tests dezz.status.widget.StartupLoadPolicyTest \
            --tests dezz.status.widget.WidgetServiceStarterPolicyTest \
            --tests dezz.status.widget.launcher.LiveClimateIconPolicyTest \
            --tests dezz.status.widget.car.CarThreeLevelCyclePolicyTest \
            --tests dezz.status.widget.car.GeelyClimateControlReliabilityTest \
            --tests dezz.status.widget.launcher.climate.ClimateLevelCyclePlannerTest \
            --tests dezz.status.widget.launcher.climate.ClimateLevelCycleContractTest \
            --tests dezz.status.widget.launcher.LauncherGlobalElementContractTest \
            --tests dezz.status.widget.launcher.LauncherActionsPanelEditorContractTest \
            --tests dezz.status.widget.launcher.navigation.NavigationPanelEditorContractTest \
            --tests dezz.status.widget.launcher.media.MediaPanelInteractionContractTest \
            --tests dezz.status.widget.launcher.MediaAutoResumeContractTest \
            --tests dezz.status.widget.launcher.VectorIconQualityContractTest \
            --tests dezz.status.widget.settings.SettingsHubRuntimeContractTest \
            --tests dezz.status.widget.settings.LauncherShortcutSettingsGridContractTest

      - name: Compile complete unsigned geelyRelease APK
        shell: bash
        env:
          ALLOW_UNSIGNED_RELEASE: 'true'
          VERSION_NAME: 'v2.8.2-ha1212'
          VERSION_CODE: '208021212'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            assembleGeelyRelease

      - name: Upload exact unsigned Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: ha1212-ancs-v2-unsigned-release
          path: app/build/outputs/apk/geely/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Pack official Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/android-build-tools-36"
          mkdir -p "$tools/lib" "$tools/lib64"
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$tools/lib/"
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" "$tools/lib64/"

      - name: Upload official Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: ha1212-android-build-tools
          path: ${{ runner.temp }}/android-build-tools-36
          if-no-files-found: error
          retention-days: 1
