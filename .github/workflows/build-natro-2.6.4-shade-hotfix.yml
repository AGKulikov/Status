name: Build signed Natro 2.6.4 system shade hotfix
# Dedicated candidate workflow: Navigator and HUD Speed remain unchanged in this release.

on:
  push:
    branches: ['feature/navigation-hud-v2']
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'tools/kx11-shade-*.sh'
      - '.github/workflows/build-natro-2.6.4-shade-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natro-2.6.4-shade-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      VERSION_NAME: '2.6.4'
      VERSION_CODE: '208021297'
      ALLOW_UNSIGNED_RELEASE: 'true'
      BUILD_TOOLS_VERSION: '36.0.0'
      EXPECTED_CERT_SHA256: '6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' "build-tools;${BUILD_TOOLS_VERSION}"
      - name: Test and assemble
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kx11-shade-audit.sh tools/kx11-shade-component.sh
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          ./gradlew testGeelyDebugUnitTest assembleGeelyRelease --no-daemon
      - name: Prepare verified offline signing handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          INPUT=$(find app/build/outputs/apk/geely/release -name '*.apk' -print -quit)
          test -s "$INPUT"
          OUT="$RUNNER_TEMP/natro-2.6.4-signing-handoff"
          mkdir -p "$OUT/tools/lib"
          cp "$INPUT" "$OUT/Natro-2.6.4-unsigned.apk"
          cp "$TOOLS/zipalign" "$OUT/tools/"
          cp "$TOOLS/apksigner" "$OUT/tools/"
          cp "$TOOLS/lib/apksigner.jar" "$OUT/tools/lib/"
          chmod 755 "$OUT/tools/zipalign" "$OUT/tools/apksigner"
          BADGING=$("$TOOLS/aapt" dump badging \
            "$OUT/Natro-2.6.4-unsigned.apk")
          printf '%s\n' "$BADGING" | grep -F \
            "package: name='ru.natro.statuswidget' versionCode='208021297' versionName='2.6.4'"
          sha256sum "$OUT/Natro-2.6.4-unsigned.apk" \
            > "$OUT/Natro-2.6.4-unsigned.apk.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload offline signing handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Natro-2.6.4-offline-signing-${{ github.run_number }}
          path: ${{ steps.handoff.outputs.path }}/*
          if-no-files-found: error
          retention-days: 3
      - name: Detect repository signing secrets
        id: signing-secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          CONFIGURED=0
          for required in KEYSTORE_BASE64 KEY_PASSWORD KEY_ALIAS; do
            test -z "${!required:-}" || CONFIGURED=$((CONFIGURED + 1))
          done
          case "$CONFIGURED" in
            3) echo 'available=true' >> "$GITHUB_OUTPUT" ;;
            0) echo 'available=false' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'Signing secrets must be configured completely' >&2
              exit 1
              ;;
          esac
      - name: Sign with stable Natro key and verify
        id: artifact
        if: steps.signing-secrets.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          INPUT=$(find app/build/outputs/apk/geely/release -name '*.apk' -print -quit)
          test -s "$INPUT"
          OUT="$RUNNER_TEMP/natro-2.6.4"
          mkdir -p "$OUT"
          KEYSTORE="$RUNNER_TEMP/natro-update.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          ALIGNED="$RUNNER_TEMP/Natro-2.6.4-aligned.apk"
          "$TOOLS/zipalign" -f -P 16 4 "$INPUT" "$ALIGNED"
          export KEY_PASSWORD
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT/Natro-2.6.4-signed.apk" "$ALIGNED"
          CERTS=$("$TOOLS/apksigner" verify --verbose --print-certs \
            "$OUT/Natro-2.6.4-signed.apk")
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -qi "$EXPECTED_CERT_SHA256"
          BADGING=$("$TOOLS/aapt" dump badging "$OUT/Natro-2.6.4-signed.apk")
          printf '%s\n' "$BADGING" | grep -F \
            "package: name='ru.natro.statuswidget' versionCode='208021297' versionName='2.6.4'"
          "$TOOLS/zipalign" -c -P 16 4 "$OUT/Natro-2.6.4-signed.apk"
          sha256sum "$OUT/Natro-2.6.4-signed.apk" | tee "$OUT/Natro-2.6.4-signed.apk.sha256"
          rm -f "$KEYSTORE" "$ALIGNED"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK
        if: steps.signing-secrets.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Natro-2.6.4-system-shade-signed-${{ github.run_number }}
          path: ${{ steps.artifact.outputs.path }}/*
          if-no-files-found: error
          retention-days: 30
