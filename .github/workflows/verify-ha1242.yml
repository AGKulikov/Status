name: Verify HA1242 Natro 2.2.8 candidate

on:
  push:
    paths:
      - 'app/src/**'
      - 'build.gradle'
      - 'release-manifests/HA1242.md'
      - '.github/workflows/verify-ha1242.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install Android SDK 36
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
      - name: Test exact release identity and build debug candidate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "return '2.2.8'" build.gradle
          grep -Fq "return 208021242" build.gradle
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 clean
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 testGeelyDebugUnitTest
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 assembleGeelyDebug
