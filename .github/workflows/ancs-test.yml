name: Build standalone KX11 ANCS Test

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ancs-test-app
    paths:
      - "ancs-test/**"
      - "ios-ancs-helper/**"
      - ".github/workflows/ancs-test.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and test standalone APK
        run: |
          chmod +x ./gradlew
          ./gradlew -p ancs-test clean testDebugUnitTest assembleDebug --stacktrace

      - name: Run lint diagnostics
        continue-on-error: true
        run: ./gradlew -p ancs-test lintDebug --stacktrace

      - name: Rename APK
        run: cp ancs-test/app/build/outputs/apk/debug/app-debug.apk KX11-ANCS-Test-v7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KX11-ANCS-Test-v7
          path: KX11-ANCS-Test-v7.apk
          if-no-files-found: error

      - name: Package iPhone helper source
        run: zip -r KX11-iPhone-ANCS-Helper-source.zip ios-ancs-helper

      - uses: actions/upload-artifact@v4
        with:
          name: KX11-iPhone-ANCS-Helper-source
          path: KX11-iPhone-ANCS-Helper-source.zip
          if-no-files-found: error

  validate-ios-helper:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build iPhone helper for simulator
        run: >-
          xcodebuild
          -project ios-ancs-helper/KX11ANCSHelper.xcodeproj
          -target KX11ANCSHelper
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
