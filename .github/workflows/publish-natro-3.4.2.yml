name: Publish verified Natro 3.4.2 stable update

on:
  push:
    branches: ['release/natro-3.4.2']
    paths: ['.github/workflows/publish-natro-3.4.2.yml', 'docs/releases/3.4.2/**']

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-natro-v3.4.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AGKulikov/Status'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: 'b2434a5804071cf21390c312bb0cf20e5861cec0'
      SOURCE_TREE: '9dc90daff513cc9c8c591e623e4cf0bef4aceed8'
      BUILD_RUN: '42351315865'
      RELEASE_TAG: 'natro-v3.4.2'
      SIGNED_SHA256: 'ba618418d5be284b98cbb18c2a05d4976f941ddef93394632e748123a656bae9'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Require exact successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" \
            | jq -e --arg source "$SOURCE_SHA" '.head_sha == $source and .status == "completed" and .conclusion == "success"'
          test "$(jq -r '.versionName' docs/releases/3.4.2/release-report.json)" = 3.4.2
          test "$(jq -r '.versionCode' docs/releases/3.4.2/release-report.json)" = 208021375
      - name: Download exact tested candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Natro-3.4.2-offline-signing-2
          run-id: 42351315865
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/natro342-candidate
      - name: Download matching signing verification tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Natro-3.4.2-signing-tools-2
          run-id: 42351315865
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/natro342-tools
      - name: Verify public offline-signature handoff without any signing key
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_apk_signature_handoff tools.tests.test_update_channel -v
          OUT="$RUNNER_TEMP/natro342-release"
          mkdir "$OUT"
          cp docs/releases/3.4.2/release-report.json docs/releases/3.4.2/natro-update.json \
            docs/releases/3.4.2/signature-verification.txt "$OUT/"
          cp docs/releases/3.4.2/release-notes.md "$OUT/README_RU.md"
          python3 tools/apk_signature_handoff.py apply \
            --unsigned "$RUNNER_TEMP/natro342-candidate/Natro-3.4.2-unsigned.apk" \
            --patch docs/releases/3.4.2/signing-handoff.json \
            --output "$OUT/Natro-3.4.2-signed.apk"
          python3 tools/verify_offline_release_handoff.py \
            --candidate "$RUNNER_TEMP/natro342-candidate" --tools "$RUNNER_TEMP/natro342-tools" \
            --release "$OUT" --source "$SOURCE_SHA" --tree "$SOURCE_TREE" \
            --run "$BUILD_RUN" --signed-sha256 "$SIGNED_SHA256"
      - name: Checkout exact APK source for source archive
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: exact-apk-source
          persist-credentials: false
      - name: Package exact public source and checksums
        run: |
          set -euo pipefail
          test "$(git -C exact-apk-source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C exact-apk-source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          OUT="$RUNNER_TEMP/natro342-release"
          git -C exact-apk-source archive --format=tar.gz --prefix=Natro-3.4.2-source/ \
            --output="$OUT/Natro-3.4.2-source.tar.gz" HEAD
          cd "$OUT"
          sha256sum Natro-3.4.2-signed.apk natro-update.json release-report.json \
            signature-verification.txt README_RU.md Natro-3.4.2-source.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Retain exact verified signed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Natro-3.4.2-verified-stable-files
          path: ${{ runner.temp }}/natro342-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Create draft, read back every asset, then publish stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/natro342-release"
          VERIFY="$RUNNER_TEMP/natro342-release-readback"
          # Do not overwrite an existing release or assets. A failed draft can be
          # resumed only after matching its source and every byte below.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              | jq -e --arg source "$SOURCE_SHA" \
                '.draft == true and .target_commitish == $source and (.assets | length) == 7'
          else
            gh release create "$RELEASE_TAG" "$OUT/"* --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --draft --title "Natro 3.4.2" \
              --notes-file docs/releases/3.4.2/release-notes.md
          fi
          mkdir "$VERIFY"
          gh release download "$RELEASE_TAG" --dir "$VERIFY" --repo "$GITHUB_REPOSITORY"
          test "$(find "$VERIFY" -maxdepth 1 -type f | wc -l)" -eq 7
          (cd "$VERIFY" && sha256sum -c SHA256SUMS.txt)
          for name in Natro-3.4.2-signed.apk natro-update.json release-report.json signature-verification.txt README_RU.md Natro-3.4.2-source.tar.gz SHA256SUMS.txt; do
            cmp "$OUT/$name" "$VERIFY/$name"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            | jq -e --arg source "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $source'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            | jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false and (.assets | length) == 7'
