name: Build Navigator route history diagnostic
on:
  push:
    branches: ['feature/route-history-diagnostic-20261011']
permissions:
  contents: read
concurrency:
  group: route-history-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Check storage and Navigator regressions
        run: |
          python3 tools/check_backup_inventory.py
          python3 -m unittest tools.tests.test_route_history_diagnostic tools.tests.test_navigation_mod_tools tools.tests.test_verify_navigation_mod_baseline -q
      - name: Compile API 28 patch
        run: bash tools/build_navigation_patch_dex.sh
      - name: Record exact source provenance
        run: python3 tools/stage_route_history_diagnostic.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Navigator-route-history-diagnostic-${{ github.run_number }}
          path: build/navigation-mod/*
          if-no-files-found: error
          retention-days: 14
