name: Verify Natro ADB and local iPhone transfer candidate
on:
  push:
    branches: ['feature/natro-map-trip-audit-20260912']
    paths: ['app/**', 'tools/**', 'wechat-compat/**', 'settings.gradle', 'build.gradle', '.github/workflows/verify-adb-lan.yml']
permissions:
  contents: read
concurrency:
  group: adb-lan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION_NAME: '2.9.9'
      VERSION_CODE: '208021332'
      ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install exact Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Unit tests and unsigned release candidate
        run: ./gradlew testGeelyDebugUnitTest assembleGeelyRelease --no-daemon --max-workers=2
      - name: JavaScript syntax
        run: node --check app/src/main/assets/lan/client.js
      - name: ADB, LAN, service recovery and selector regression tests
        run: python3 -m unittest tools.tests.test_adb_service_replay tools.tests.test_lan_core_replay tools.tests.test_drive_selector_port tools.tests.test_physical_button_model -v
      - name: Stage exact candidate and signing tools
        run: python3 tools/stage_natro_adb_candidate.py
      - name: Upload verified unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Natro-2.9.9-offline-signing-${{ github.run_number }}
          path: ${{ runner.temp }}/natro-2.9.9-candidate/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: natro-adb-lan-candidate-${{ github.run_number }}
          path: |
            app/build/outputs/apk/geely/release/*.apk
            app/build/test-results/**
            app/build/reports/tests/**
          retention-days: 14
