name: Verify Natro 2.3.2 and Helper 69 Personal Team

on:
  push:
    branches: ['release/natro-2.3.2-helper69']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  android:
    name: Android tests and unsigned release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION_NAME: '2.3.2'
      VERSION_CODE: '208021256'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Publish Android workflow locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='natro-2.3.2/android' \
            -f description='Android tests and unsigned release are running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build
        env:
          ALLOW_UNSIGNED_RELEASE: 'true'
        run: ./gradlew testGeelyDebugUnitTest assembleGeelyRelease --no-daemon
      - name: Verify exact 2.3.2 road-log recovery contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "if (version == '2.3.2')" build.gradle
          grep -Fq 'return 208021256' build.gradle
          grep -Fq 'YANDEX_MAX_ATTEMPTS = 72' \
            app/src/main/java/dezz/status/widget/launcher/MediaAutoResumeController.java
          grep -Fq 'YANDEX_BROWSER_RETRY_COOLDOWN_MS = 30_000L' \
            app/src/main/java/dezz/status/widget/launcher/MediaAutoResumeController.java
          grep -Fq '"running".equals(processState)' \
            app/src/main/java/dezz/status/widget/launcher/MediaResumeCommand.java
          grep -Fq 'service_prewarm' \
            app/src/main/java/dezz/status/widget/launcher/YandexMusicBrowserStarter.java
          grep -Fq 'retainsEnrolledSystemOwner' \
            app/src/main/java/dezz/status/widget/phone/transport/v2/android/AndroidCentralTransportV2.java
          grep -Fq 'lastStateFingerprints' \
            app/src/main/java/dezz/status/widget/phone/CarRemoteControllerV1.java
          grep -Fq 'external overlay pause statusRemainingMs=' \
            app/src/main/java/dezz/status/widget/WidgetService.java
          grep -Fq 'Buffer both' \
            app/src/main/java/dezz/status/widget/WidgetService.java
          grep -Fq 'hasParserUnsafeProofCharacters' \
            app/src/main/java/dezz/status/widget/sprut/SprutHubController.java
          grep -Fq 'KEY_LAST_LIFECYCLE_ELAPSED' \
            app/src/main/java/dezz/status/widget/launcher/MediaAutoResumeController.java
          test -z "$(find app ios -type f \( -name '*.p8' -o -name 'AuthKey_*.p8' \) \
            -print -quit)"
          APK=$(find app/build/outputs/apk/geely/release -name '*.apk' -print -quit)
          test -n "$APK"
          mv "$APK" "$RUNNER_TEMP/Natro-2.3.2-unsigned-release.apk"
      - name: Upload Android candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Natro-2.3.2-unsigned-release
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/Natro-2.3.2-unsigned-release.apk
      - name: Publish final Android status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            *) STATE=error ;;
          esac
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='natro-2.3.2/android' \
            -f description="Android job finished: $JOB_STATUS" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  helper:
    name: Helper 69 unchanged Personal Team companion
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Replay portable Helper contracts
        run: ios/KX11-iPhone-ANCS-Helper-v69-personal/verify-v69-personal-contract.sh
      - name: Compile unsigned simulator app and extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v69-personal/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Release \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/Helper69PersonalProducts" \
            OBJROOT="$RUNNER_TEMP/Helper69PersonalIntermediates" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP="$RUNNER_TEMP/Helper69PersonalProducts/Release-iphonesimulator/"
          APP="${APP}KX11ANCSHelper.app"
          test -d "$APP/PlugIns/NatroLiveActivityExtension.appex"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" \
            = '69.0'
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = '69'
