name: Verify iPhone Helper v11

on:
  push:
    branches:
      - 'release/kx11-ancs-helper-v11'
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v11/**'
      - '.github/workflows/verify-helper-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    name: Compile Helper v11 without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project settings
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v11/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings >/tmp/helper-v11-build-settings.txt
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper' \
            /tmp/helper-v11-build-settings.txt
          grep -q 'MARKETING_VERSION = 11.0' /tmp/helper-v11-build-settings.txt
          grep -q 'CURRENT_PROJECT_VERSION = 11' /tmp/helper-v11-build-settings.txt

      - name: Compile Helper v11
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v11/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/KX11ANCSHelperProducts" \
            OBJROOT="$RUNNER_TEMP/KX11ANCSHelperIntermediates" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify single-link architecture
        run: |
          set -euo pipefail
          source=ios/KX11-iPhone-ANCS-Helper-v11/KX11ANCSHelper/ViewController.swift
          plist=ios/KX11-iPhone-ANCS-Helper-v11/KX11ANCSHelper/Info.plist
          ! grep -q 'CBCentralManager' "$source"
          ! grep -q 'scanForPeripherals' "$source"
          ! grep -q '<string>bluetooth-central</string>' "$plist"
          grep -q 'CBPeripheralManagerOptionRestoreIdentifierKey' "$source"
          grep -q 'properties: \[.read, .notify\]' "$source"
          grep -q 'telemetrySampleInterval: TimeInterval = 1' "$source"
          grep -q 'dataServiceIdentifierDidChange' "$source"
          grep -q 'batteryStateDidChange' "$source"
          grep -q 'maximumLogLines = 600' "$source"
          grep -q '<string>bluetooth-peripheral</string>' "$plist"
