name: Verify parking window visibility source

on:
  push:
    branches: ['fix/parking-window-visibility']
    paths:
      - 'app/**'
      - 'PROJECT_REQUIREMENTS_RU.md'
      - '.github/workflows/verify-parking-window-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android compilation dependencies
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile Android sources and run unit tests
        run: ./gradlew testGeelyDebugUnitTest --no-daemon
