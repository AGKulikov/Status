name: Verify HA1200 current-link ANCS security

on:
  push:
    branches:
      - 'work/ha1200-current-link-security'
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - '.github/workflows/verify-ha1200.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - '.github/workflows/verify-ha1200.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Security gate contracts and unsigned geelyRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Preserved trunk and HA1200 ANCS contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            testGeelyDebugUnitTest \
            --tests dezz.status.widget.Ha1197TrunkAndReconnectContractTest \
            --tests dezz.status.widget.Ha1200CurrentLinkSecurityContractTest

      - name: Compile complete unsigned geelyRelease APK
        shell: bash
        env:
          ALLOW_UNSIGNED_RELEASE: 'true'
          VERSION_NAME: 'v2.8.2-ha1200'
          VERSION_CODE: '208021200'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            assembleGeelyRelease

      - name: Upload exact unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ha1200-unsigned-release
          path: app/build/outputs/apk/geely/release/*.apk
          if-no-files-found: error
          retention-days: 7
