name: Verify iPhone Helper v23

on:
  push:
    branches:
      - 'release/kx11-ancs-helper-v23'
      - 'release/v*'
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v23/**'
      - '.github/workflows/verify-helper-v23.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    name: Compile Helper v23 without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v23/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings >"$RUNNER_TEMP/helper-v23-build-settings.txt"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper' \
            "$RUNNER_TEMP/helper-v23-build-settings.txt"
          grep -q 'MARKETING_VERSION = 23.0' \
            "$RUNNER_TEMP/helper-v23-build-settings.txt"
          grep -q 'CURRENT_PROJECT_VERSION = 23' \
            "$RUNNER_TEMP/helper-v23-build-settings.txt"

      - name: Compile Helper v23
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v23/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/KX11ANCSHelperProducts" \
            OBJROOT="$RUNNER_TEMP/KX11ANCSHelperIntermediates" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify current-link recovery and lock telemetry
        shell: bash
        run: |
          set -euo pipefail
          source=ios/KX11-iPhone-ANCS-Helper-v23/KX11ANCSHelper/ViewController.swift
          plist=ios/KX11-iPhone-ANCS-Helper-v23/KX11ANCSHelper/Info.plist
          grep -q 'KX11 ANCS HELPER v23' "$source"
          grep -q 'discoverServices(nil)' "$source"
          grep -q 'discoverCharacteristics(nil, for: service)' "$source"
          grep -q 'centralCharacteristicDiscoveryWorkItem' "$source"
          grep -q 'centralServiceRediscoveryWorkItem' "$source"
          grep -q 'CBError.Code.uuidNotAllowed.rawValue' "$source"
          grep -q 'didModifyServices invalidatedServices' "$source"
          grep -q 'centralRelayProved' "$source"
          grep -q 'if phoneLocked { flags |= 0x20 }' "$source"
          grep -q 'CBConnectPeripheralOptionRequiresANCS: true' "$source"
          grep -q 'AutoReconnect=false' "$source"
          grep -q 'ManualFreshAdvertisement=true' "$source"
          ! grep -q 'kCBConnectOptionEnableAutoReconnect' "$source"
          grep -q '<string>bluetooth-central</string>' "$plist"
          grep -q '<string>bluetooth-peripheral</string>' "$plist"
