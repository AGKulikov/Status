name: Build geelyDebug

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'rewrite/**'
      - 'agent/**'
  pull_request:

# A feature branch with an open PR must produce one build, not an identical push build followed
# by a pull-request build. A newer revision supersedes a queued/running revision of that branch.
concurrency:
  group: geely-debug-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          # sdkmanager closes stdin after accepting all licenses, which gives `yes` SIGPIPE.
          # Temporarily disable pipefail so the step follows sdkmanager's exit code instead.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Decode stable update keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          REQUIRE_STABLE: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/agent/ha1081-phone-ancs' }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            touch .stable-update-signing
          elif [[ "$REQUIRE_STABLE" == "true" ]]; then
            echo "KEYSTORE_BASE64 is required for installable update artifacts" >&2
            exit 1
          else
            echo "Stable keystore secret is unavailable; fork/PR build will use debug signing"
          fi

      - name: Test and build geelyDebug
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # CI revisions live above the earlier hand-built HA14..HA24 line, so every artifact is
          # accepted by Android as an upgrade. Four digits are reserved by build.gradle.
          REVISION=$((1000 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="v2.8.2-ha${REVISION}"
          export VERSION_CODE=$((208020000 + REVISION))
          # Keep unit tests and APK assembly in separate Gradle invocations.
          # Running both task graphs together can make D8 see duplicate
          # non-namespaced AndroidX R classes in this legacy project.
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon testGeelyDebugUnitTest
          ./gradlew --no-daemon assembleGeelyDebug

      - name: Verify APK identity, alignment and signature
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/geely/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='ru.natro.statuswidget'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          CERTS=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$CERTS"
          if [[ -f .stable-update-signing ]]; then
            echo "$CERTS" | grep -qi "6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75"
          fi
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: status-widget-ha-geelyDebug
          path: |
            app/build/outputs/apk/geely/debug/*.apk
            app/build/outputs/apk/geely/debug/*.sha256
          if-no-files-found: error
          retention-days: 30

  # The historical update key deliberately stays outside GitHub. Build one exact unsigned
  # HA1081 release in CI, then sign and verify that immutable artifact in the trusted workspace.
  build-ha1081-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/ha1081-phone-ancs' && github.repository == 'AGKulikov/Status'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout exact HA1081 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Build and verify exact unsigned HA1081 release
        env:
          HEAD_SHA: ${{ github.sha }}
          VERSION_NAME: v2.8.2-ha1081
          VERSION_CODE: '208021081'
          ALLOW_UNSIGNED_RELEASE: 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test ! -e keystore.jks
          chmod +x gradlew
          ./gradlew --no-daemon testGeelyDebugUnitTest
          ./gradlew --no-daemon assembleGeelyRelease
          APK="app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}-release.apk"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='ru.natro.statuswidget'"
          echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'"
          if echo "$BADGING" | grep -Fq "application-debuggable"; then
            echo "Exact HA1081 release must not be debuggable" >&2
            exit 1
          fi
          ACTUAL_VERSION_CODE=$(echo "$BADGING" \
            | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" \
            | head -n 1)
          test "$ACTUAL_VERSION_CODE" -eq "$VERSION_CODE"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"; then
            echo "CI handoff unexpectedly contains a signature" >&2
            exit 1
          fi
          mkdir -p release-out
          cp "$APK" "release-out/status-widget-ha-${VERSION_NAME}-unsigned.apk"
          cd release-out
          APK_NAME="status-widget-ha-${VERSION_NAME}-unsigned.apk"
          UNSIGNED_SHA=$(sha256sum "$APK_NAME" | awk '{print $1}')
          printf '%s  %s\n' "$UNSIGNED_SHA" "$APK_NAME" > "${APK_NAME}.sha256"
          jq -n \
            --arg tag "$VERSION_NAME" \
            --arg package "ru.natro.statuswidget" \
            --arg versionName "$VERSION_NAME" \
            --arg sourceSha "$HEAD_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg unsignedSha256 "$UNSIGNED_SHA" \
            --argjson versionCode "$VERSION_CODE" \
            '{
              tag: $tag,
              package: $package,
              versionName: $versionName,
              versionCode: $versionCode,
              sourceSha: $sourceSha,
              workflowRunId: $workflowRunId,
              unsignedSha256: $unsignedSha256
            }' > manifest.json

      - name: Upload verified unsigned HA1081 handoff
        uses: actions/upload-artifact@v4
        with:
          name: status-widget-ha-v2.8.2-ha1081-unsigned
          path: release-out/*
          if-no-files-found: error
          retention-days: 30
