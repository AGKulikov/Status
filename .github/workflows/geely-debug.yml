name: Build geelyDebug

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'rewrite/**'
      - 'release/**'
  pull_request:

# A feature branch with an open PR must produce one build, not an identical push build followed
# by a pull-request build. A newer revision supersedes a queued/running revision of that branch.
concurrency:
  group: geely-debug-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # Natro release branches use their own unsigned/full-suite and signing workflows. This
    # legacy job requires the stable keystore and only owns the v2.8.2 HA release namespace.
    if: github.event_name != 'push' || github.ref_name == 'main' || startsWith(github.ref_name, 'rewrite/') || startsWith(github.ref_name, 'release/v2.8.2-ha')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          # sdkmanager closes stdin after accepting all licenses, which gives `yes` SIGPIPE.
          # Temporarily disable pipefail so the step follows sdkmanager's exit code instead.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Decode stable update keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          # Pull requests validate with debug signing. Stable signing remains mandatory for
          # branch/tag publications, where repository secrets are intentionally available.
          REQUIRE_STABLE: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            touch .stable-update-signing
          elif [[ "$REQUIRE_STABLE" == "true" ]]; then
            echo "KEYSTORE_BASE64 is required for installable update artifacts" >&2
            exit 1
          else
            echo "Stable keystore secret is unavailable; fork/PR build will use debug signing"
          fi

      - name: Test and build APK
        id: build
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$SOURCE_BRANCH" =~ ^release/(v2\.8\.2-ha([0-9]+))$ ]]; then
            export VERSION_NAME="${BASH_REMATCH[1]}"
            REVISION="${BASH_REMATCH[2]}"
            export VERSION_CODE=$((208020000 + REVISION))
            BUILD_TASK="assembleGeelyRelease"
            APK_DIR="app/build/outputs/apk/geely/release"
            ARTIFACT_NAME="status-widget-ha-${VERSION_NAME}-release"
            test -f .stable-update-signing
            test -n "$KEY_PASSWORD"
          else
            # CI revisions live above the earlier hand-built HA14..HA24 line, so every artifact is
            # accepted by Android as an upgrade. Four digits are reserved by build.gradle.
            REVISION=$((1000 + GITHUB_RUN_NUMBER))
            export VERSION_NAME="v2.8.2-ha${REVISION}"
            export VERSION_CODE=$((208020000 + REVISION))
            BUILD_TASK="assembleGeelyDebug"
            APK_DIR="app/build/outputs/apk/geely/debug"
            ARTIFACT_NAME="status-widget-ha-geelyDebug"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          # Keep unit tests and APK assembly in separate Gradle invocations.
          # Running both task graphs together can make D8 see duplicate
          # non-namespaced AndroidX R classes in this legacy project.
          # A clean, single-worker resource pipeline is mandatory: the broken HA1147 archive
          # contained dex files but silently omitted resources.arsc and every res/ entry.
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 clean
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 testGeelyDebugUnitTest
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 "$BUILD_TASK"

      - name: Verify APK identity, alignment and signature
        env:
          APK_DIR: ${{ steps.build.outputs.apk_dir }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$APK_DIR" -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'resources.arsc'
          RESOURCE_ENTRIES=$(unzip -Z1 "$APK" | grep -c '^res/')
          test "$RESOURCE_ENTRIES" -gt 500
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK" >/dev/null
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='ru.natro.statuswidget' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          CERTS=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$CERTS"
          if [[ -f .stable-update-signing ]]; then
            echo "$CERTS" | grep -qi "6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75"
          fi
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.apk_dir }}/*.apk
            ${{ steps.build.outputs.apk_dir }}/*.sha256
          if-no-files-found: error
          retention-days: 30
