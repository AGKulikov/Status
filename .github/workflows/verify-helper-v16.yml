name: Verify iPhone Helper v16

on:
  push:
    branches:
      - 'release/kx11-ancs-helper-v16'
      - 'release/v*'
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v16/**'
      - '.github/workflows/verify-helper-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    name: Compile Helper v16 without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project settings
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v16/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings >/tmp/helper-v16-build-settings.txt
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper' \
            /tmp/helper-v16-build-settings.txt
          grep -q 'MARKETING_VERSION = 16.0' /tmp/helper-v16-build-settings.txt
          grep -q 'CURRENT_PROJECT_VERSION = 16' /tmp/helper-v16-build-settings.txt

      - name: Compile Helper v16
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v16/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/KX11ANCSHelperProducts" \
            OBJROOT="$RUNNER_TEMP/KX11ANCSHelperIntermediates" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify selectable single-route architecture
        run: |
          set -euo pipefail
          source=ios/KX11-iPhone-ANCS-Helper-v16/KX11ANCSHelper/ViewController.swift
          plist=ios/KX11-iPhone-ANCS-Helper-v16/KX11ANCSHelper/Info.plist
          grep -q 'case peripheral = 0' "$source"
          grep -q 'UISegmentedControl(items: \["Peripheral", "Central"\])' "$source"
          grep -q 'CBConnectPeripheralOptionRequiresANCS: true' "$source"
          grep -q 'kCBConnectOptionEnableAutoReconnect' "$source"
          grep -q 'stopAllBleRoutes()' "$source"
          grep -q 'Data("PAIR".utf8)' "$source"
          grep -q 'readValue(for: secure)' "$source"
          grep -q 'resetCentralLink(reason:' "$source"
          grep -q 'centralRequireFreshAdvertisement = true' "$source"
          grep -q 'discoverCharacteristics(nil, for: service)' "$source"
          grep -q 'activeService === service' "$source"
          grep -q 'B3 current-link challenge получен' "$source"
          grep -q 'centralSecureReadAttempt >= 5' "$source"
          grep -q 'centralReconnectDelays: \[TimeInterval\] = \[1, 2, 5, 10, 20, 30\]' "$source"
          grep -q 'telemetry.properties.contains(.notify)' "$source"
          grep -q 'setNotifyValue(true, for: telemetry)' "$source"
          grep -q 'KX11 background wake poll' "$source"
          ! grep -q 'CBConnectPeripheralOptionEnableTransportBridgingKey' "$source"
          grep -q '<string>bluetooth-central</string>' "$plist"
          grep -q '<string>bluetooth-peripheral</string>' "$plist"
