name: Authorize exact HA1240 Natro signed prerelease

on:
  push:
    branches: ['release-auth/natro-v2.2.6']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: authorize-ha1240-natro-v2.2.6
  cancel-in-progress: false

jobs:
  create-exact-tag:
    name: Create one immutable Natro 2.2.6 tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}

    steps:
      - name: Checkout exact release-intent commit without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify exact one-shot release intent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'AGKulikov/Status'
          case "$GITHUB_REF" in
            refs/heads/agent/natro-2.2.6-helper58|\
            refs/heads/release-auth/natro-v2.2.6) ;;
            *) echo "Unexpected release authorization ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          test "$GITHUB_SHA" = "$(git rev-parse 'HEAD^{commit}')"
          test -z "$(git status --short --ignore-submodules=none)"
          REMOTE_BRANCH_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/natro-2.2.6-helper58" \
            --jq '.object.sha')
          test "$REMOTE_BRANCH_SHA" = "$GITHUB_SHA"
          jq -e \
            '.schema == "natro-release-intent/v1"
              and .appName == "Natro"
              and .tag == "natro-v2.2.6"
              and .versionName == "2.2.6"
              and .versionCode == 208021240
              and .helperVersion == "58.0"
              and .helperBuild == 58
              and .publication == "signed-prerelease"
              and .certificateSha256 == "6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75"' \
            release-manifests/HA1240.publish.json >/dev/null
          grep -Fq "return '2.2.6'" build.gradle
          grep -Fq 'return 208021240' build.gradle
          test "$(sed -n 's/.*<string name="app_name">\(.*\)<\/string>.*/\1/p' \
            app/src/main/res/values/strings.xml)" = 'Natro'
          test "$(sed -n 's/.*<string name="app_name">\(.*\)<\/string>.*/\1/p' \
            app/src/main/res/values-ru/strings.xml)" = 'Natro'
          HELPER_TREE=$(git rev-parse \
            "${GITHUB_SHA}:ios/KX11-iPhone-ANCS-Helper-v58")
          test "$HELPER_TREE" = '94fa788a7f6a8fb56d16e1853e0e5b0ae37f9f13'

      - name: Create exact tag without moving or overwriting anything
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='natro-v2.2.6'
          TAG_API="repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          if EXISTING=$(gh api "$TAG_API" 2>/dev/null); then
            test "$(jq -r '.object.type' <<<"$EXISTING")" = commit
            test "$(jq -r '.object.sha' <<<"$EXISTING")" = "$GITHUB_SHA" || {
              echo "Existing $TAG points to another commit; refusing to move it" >&2
              exit 1
            }
          else
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "A release already exists without the expected exact tag" >&2
              exit 1
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
          VERIFIED=$(gh api "$TAG_API")
          test "$(jq -r '.object.type' <<<"$VERIFIED")" = commit
          test "$(jq -r '.object.sha' <<<"$VERIFIED")" = "$GITHUB_SHA"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  sign-and-publish:
    name: Build, sign, verify and publish exact Natro bytes
    needs: create-exact-tag
    uses: ./.github/workflows/release-ha1240.yml
    with:
      release_ref: ${{ needs.create-exact-tag.outputs.source_sha }}
    secrets: inherit
