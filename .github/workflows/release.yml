name: Release

on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION=${{ github.event.inputs.tag }}
        elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == release/v* ]]; then
          VERSION=${GITHUB_REF_NAME#release/}
        else
          VERSION=${{ github.ref_name }}
        fi
        [[ "$VERSION" == v* ]] || {
          echo "Release version must start with v: $VERSION" >&2
          exit 1
        }
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Decode stable update keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      shell: bash
      run: |
        test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is required" >&2; exit 1; }
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Test and build release APK
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is required" >&2; exit 1; }
        # Never package a release from stale incremental outputs. A previous local HA1147
        # artifact retained dex files but omitted resources.arsc and every res/ entry.
        ./gradlew --no-daemon --no-configuration-cache clean
        ./gradlew --no-daemon --no-configuration-cache --max-workers=1 testGeelyDebugUnitTest \
          --tests 'dezz.status.widget.phone.transport.v2.*' \
          --tests 'dezz.status.widget.phone.transport.switching.*' \
          --tests dezz.status.widget.phone.PhoneConnectorSettingsContractTest \
          --tests dezz.status.widget.Ha1196AuthorizedAncsAndTrunkCatalogContractTest \
          --tests dezz.status.widget.Ha1197TrunkAndReconnectContractTest
        ./gradlew --no-daemon --no-configuration-cache --max-workers=1 assembleGeelyRelease
        APK="app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}-release.apk"
        test -f "$APK"
        unzip -Z1 "$APK" | grep -Fx 'resources.arsc'
        RESOURCE_ENTRIES=$(unzip -Z1 "$APK" | grep -c '^res/')
        test "$RESOURCE_ENTRIES" -gt 500
        "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK" >/dev/null
        BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
        echo "$BADGING"
        echo "$BADGING" | grep -F "package: name='ru.natro.statuswidget'"
        echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'"
        VERSION_CODE=$(echo "$BADGING" \
          | sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" \
          | head -n 1)
        test -n "$VERSION_CODE"
        # HA1124 must install as an in-place upgrade over the public HA1122 build.
        test "$VERSION_CODE" -gt 208021122
        "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
        # Force verification from API 24 so apksigner checks the embedded v2 block as well
        # as the v3 block used by the Android 9 KX11 package installer.
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
          --min-sdk-version 24 "$APK" | tee /tmp/apk-certs.txt
        grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apk-certs.txt
        grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apk-certs.txt
        grep -qi "6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75" /tmp/apk-certs.txt
        mv "$APK" "app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}.apk"

    - name: Verify Helper v47 portable wire and switch contracts
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ios/KX11-iPhone-ANCS-Helper-v47/verify-v47-contract.sh
        PYTHONDONTWRITEBYTECODE=1 \
          ios/KX11-iPhone-ANCS-Helper-v47/verify-v47-contract.sh

    - name: Package Android and Helper v47 transport-v2 candidate
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release-out
        APK="app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}.apk"
        cp "$APK" "release-out/status-widget-ha-${VERSION_NAME}.apk"
        git archive \
          --format=zip \
          --prefix=KX11-iPhone-ANCS-Helper-v47/ \
          --output=release-out/KX11-iPhone-ANCS-Helper-v47.zip \
          HEAD:ios/KX11-iPhone-ANCS-Helper-v47
        jq -n \
          --arg android "$VERSION_NAME" \
          --arg helper "47.0" \
          --arg sourceSha "$GITHUB_SHA" \
          '{android: $android, helper: $helper, sourceSha: $sourceSha,
            status: "candidate; hosted Xcode and physical-device field matrix are release gates",
            connectionModel: "dual route v2 with persisted confirmed-quiescence switching",
            identity: "installation UUID proof and UUID-only discovery; no local-name fallback"}' \
          > release-out/matched-pair.json
        sha256sum \
          "release-out/status-widget-ha-${VERSION_NAME}.apk" \
          release-out/KX11-iPhone-ANCS-Helper-v47.zip \
          > release-out/SHA256SUMS.txt

    - name: Upload matched v47 candidate pair
      uses: actions/upload-artifact@v4
      with:
        name: status-widget-ha-${{ steps.version.outputs.version }}-helper-v47-candidate
        path: release-out/*
        if-no-files-found: error
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Candidate ${{ steps.version.outputs.version }} + Helper v47
        body_path: ios/KX11-iPhone-ANCS-Helper-v47/RELEASE.txt
        draft: false
        prerelease: true
        files: release-out/*

  report-release-result:
    name: Record release result
    if: ${{ always() }}
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout release branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Record HA1212 v47 candidate result
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_RESULT: ${{ needs.build-and-release.result }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ci-status
        gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > /tmp/release-jobs.json
        jq \
          --arg runId "${GITHUB_RUN_ID}" \
          --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
          --arg sourceSha "${GITHUB_SHA}" \
          --arg result "${RELEASE_RESULT}" \
          '{
            runId: $runId,
            runAttempt: $runAttempt,
            sourceSha: $sourceSha,
            result: $result,
            jobs: [.jobs[] | {
              id,
              name,
              status,
              conclusion,
              html_url,
              steps: [.steps[]? | {number, name, status, conclusion}]
            }]
          }' /tmp/release-jobs.json > ci-status/HA1212-v47-candidate-release.json
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ci-status/HA1212-v47-candidate-release.json
        git commit -m "ci: record HA1212 v47 candidate result"
        git push origin "HEAD:${GITHUB_REF_NAME}"
