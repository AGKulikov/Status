name: Release

on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION=${{ github.event.inputs.tag }}
        elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == release/v* ]]; then
          VERSION=${GITHUB_REF_NAME#release/}
        else
          VERSION=${{ github.ref_name }}
        fi
        [[ "$VERSION" == v* ]] || {
          echo "Release version must start with v: $VERSION" >&2
          exit 1
        }
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Decode stable update keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      shell: bash
      run: |
        test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is required" >&2; exit 1; }
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Test and build release APK
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is required" >&2; exit 1; }
        # Never package a release from stale incremental outputs. A previous local HA1147
        # artifact retained dex files but omitted resources.arsc and every res/ entry.
        ./gradlew --no-daemon --no-configuration-cache clean
        ./gradlew --no-daemon --no-configuration-cache --max-workers=1 testGeelyDebugUnitTest
        ./gradlew --no-daemon --no-configuration-cache --max-workers=1 assembleGeelyRelease
        APK="app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}-release.apk"
        test -f "$APK"
        unzip -Z1 "$APK" | grep -Fx 'resources.arsc'
        RESOURCE_ENTRIES=$(unzip -Z1 "$APK" | grep -c '^res/')
        test "$RESOURCE_ENTRIES" -gt 500
        "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK" >/dev/null
        BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
        echo "$BADGING"
        echo "$BADGING" | grep -F "package: name='ru.natro.statuswidget'"
        echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'"
        VERSION_CODE=$(echo "$BADGING" \
          | sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" \
          | head -n 1)
        test -n "$VERSION_CODE"
        # HA1124 must install as an in-place upgrade over the public HA1122 build.
        test "$VERSION_CODE" -gt 208021122
        "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-certs.txt
        grep -qi "6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75" /tmp/apk-certs.txt
        mv "$APK" "app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}.apk"

    - name: Package matched HA1196 and Helper v33 release
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release-out
        APK="app/build/outputs/apk/geely/release/status-widget-ha-${VERSION_NAME}.apk"
        cp "$APK" "release-out/status-widget-ha-${VERSION_NAME}.apk"
        git archive \
          --format=zip \
          --prefix=KX11-iPhone-ANCS-Helper-v33/ \
          --output=release-out/KX11-iPhone-ANCS-Helper-v33.zip \
          HEAD:ios/KX11-iPhone-ANCS-Helper-v33
        jq -n \
          --arg android "$VERSION_NAME" \
          --arg helper "33.0" \
          --arg sourceSha "$GITHUB_SHA" \
          '{android: $android, helper: $helper, sourceSha: $sourceSha,
            connectionModel: "single RequiresANCS owner; Android background-open on retained link",
            androidGattOwner: "one retained clientIf; status 133 re-arms with BluetoothGatt.connect"}' \
          > release-out/matched-pair.json
        sha256sum \
          "release-out/status-widget-ha-${VERSION_NAME}.apk" \
          release-out/KX11-iPhone-ANCS-Helper-v33.zip \
          > release-out/SHA256SUMS.txt

    - name: Upload verified matched release pair
      uses: actions/upload-artifact@v4
      with:
        name: status-widget-ha-${{ steps.version.outputs.version }}-helper-v33
        path: release-out/*
        if-no-files-found: error
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body_path: release-manifests/HA1196.md
        draft: false
        prerelease: false
        files: release-out/*
