name: Verify passive DIM UART capture
on:
  push:
    branches: ['feature/dim-uart-20261018']
permissions:
  contents: read
concurrency:
  group: dim-uart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VERSION_NAME: '3.3.2'
      VERSION_CODE: '208021365'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Download pinned signed APK for Android 9 updater regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/natro-updater-fixture"
          gh release download natro-v3.2.5 --repo "$GITHUB_REPOSITORY" \
            --pattern Natro-3.2.5-signed.apk --dir "$RUNNER_TEMP/natro-updater-fixture"
          echo "d3fed86ca73c76d1ff10eb3a89a22a731abc50df33ab1782e0986aa164a2daf6  $RUNNER_TEMP/natro-updater-fixture/Natro-3.2.5-signed.apk" | sha256sum -c -
          echo "NATRO_UPDATER_FIXTURE_APK=$RUNNER_TEMP/natro-updater-fixture/Natro-3.2.5-signed.apk" >> "$GITHUB_ENV"
      - name: Storage review and portable regressions
        run: |
          python3 tools/check_backup_inventory.py
          python3 -m unittest -v tools.tests.test_dim_uart_recording tools.tests.test_system_file_dump tools.tests.test_adb_service_replay tools.tests.test_natro_shared_folder tools.tests.test_lan_core_replay
          node --check app/src/main/assets/lan/client.js
      - name: Full Android source and regression suite (no APK)
        run: ./gradlew testGeelyDebugUnitTest --no-daemon --max-workers=2
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dim-uart-tests-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 14
