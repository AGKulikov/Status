name: Verify iPhone Helper v40

on:
  push:
    branches:
      - 'work/ha1205-ancs-recovery'
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v40/**'
      - '.github/workflows/verify-helper-v40.yml'
  pull_request:
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v40/**'
      - '.github/workflows/verify-helper-v40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    name: Compile Helper v40 without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v40/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings >"$RUNNER_TEMP/helper-v40-build-settings.txt"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper' \
            "$RUNNER_TEMP/helper-v40-build-settings.txt"
          grep -q 'MARKETING_VERSION = 40.0' "$RUNNER_TEMP/helper-v40-build-settings.txt"
          grep -q 'CURRENT_PROJECT_VERSION = 40' "$RUNNER_TEMP/helper-v40-build-settings.txt"

      - name: Compile Helper v40
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v40/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/KX11ANCSHelperProducts" \
            OBJROOT="$RUNNER_TEMP/KX11ANCSHelperIntermediates" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify bounded destructive recovery and preserved v39 contracts
        shell: bash
        run: |
          set -euo pipefail
          sh ios/KX11-iPhone-ANCS-Helper-v40/verify-v40-contract.sh
