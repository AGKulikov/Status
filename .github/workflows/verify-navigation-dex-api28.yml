name: Verify released Navigator DEX on Android 9 (no APK)
on:
  push:
    branches: ['fix/ancs-radio-recovery-20260908']
    paths: ['tests/navigation/verify_release_dex_api28.py', '.github/workflows/verify-navigation-dex-api28.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain exact 2.8.1 release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Natro-2.8.1-candidate-1
          run-id: 33988028400
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/natro-dex-281
      - name: Obtain exact 2.8.2 release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Natro-2.8.2-candidate-1
          run-id: 34147970659
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/natro-dex-282
      - name: Prepare Android 9 emulator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-28;google_apis;x86_64'
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name natro-api28 --package 'system-images;android-28;google_apis;x86_64'
          mkdir -p "$RUNNER_TEMP/natro-api28-report"
          "$ANDROID_HOME/emulator/emulator" -avd natro-api28 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on -memory 2048 >"$RUNNER_TEMP/natro-api28-report/emulator.txt" 2>&1 &
      - name: Verify both released DEX files with API 28 ART
        run: |
          python3 tests/navigation/verify_release_dex_api28.py \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --old-dex "$RUNNER_TEMP/natro-dex-281/classes19.dex" \
            --new-dex "$RUNNER_TEMP/natro-dex-282/classes19.dex" \
            --out "$RUNNER_TEMP/natro-api28-report"
      - name: Save verifier evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: navigator-api28-dex-verification
          path: ${{ runner.temp }}/natro-api28-report/
          retention-days: 7
      - name: Stop disposable emulator
        if: always()
        run: '"$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true'
