name: Verify HA1209 atomic HOME and quiet startup

on:
  push:
    branches:
      - 'work/ha1209-launcher-first-frame'
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - 'third_party/**'
      - 'release-manifests/HA1209.md'
      - '.github/workflows/verify-ha1209.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - 'third_party/**'
      - 'release-manifests/HA1209.md'
      - '.github/workflows/verify-ha1209.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: HA1197-HA1209 contracts and geelyRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack exact Android source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/status-ha1209-source.bundle" HEAD

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ha1209-source-bundle
          path: ${{ runner.temp }}/status-ha1209-source.bundle
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Preserved transport, launcher and quiet-start contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            testGeelyDebugUnitTest \
            --tests dezz.status.widget.Ha1152RegressionContractTest \
            --tests dezz.status.widget.Ha1154HelperAndDriverFavoritesContractTest \
            --tests dezz.status.widget.Ha1141HudProcessIsolationTest \
            --tests dezz.status.widget.Ha1197TrunkAndReconnectContractTest \
            --tests dezz.status.widget.Ha1198AutomaticBleRecoveryContractTest \
            --tests dezz.status.widget.Ha1199ReferenceAncsConnectionContractTest \
            --tests dezz.status.widget.Ha1200CurrentLinkSecurityContractTest \
            --tests dezz.status.widget.Ha1201DirectAttachContractTest \
            --tests dezz.status.widget.Ha1202ColdStartAuthorizationContractTest \
            --tests dezz.status.widget.Ha1203VectorIconPickerContractTest \
            --tests dezz.status.widget.Ha1204LiveClimateAndModernIconContractTest \
            --tests dezz.status.widget.Ha1205AncsRecoveryContractTest \
            --tests dezz.status.widget.Ha1206HotUpdateRecoveryContractTest \
            --tests dezz.status.widget.Ha1207PostReadyAttachContractTest \
            --tests dezz.status.widget.Ha1208PublicationRecoveryContractTest \
            --tests dezz.status.widget.Ha1209LauncherStartupContractTest \
            --tests dezz.status.widget.StartupLoadPolicyTest \
            --tests dezz.status.widget.WidgetServiceStarterPolicyTest \
            --tests dezz.status.widget.phone.transport.AncsRecoveryPolicyTest \
            --tests dezz.status.widget.phone.transport.ManagedIncomingPublicationPolicyTest \
            --tests dezz.status.widget.launcher.LiveClimateIconPolicyTest \
            --tests dezz.status.widget.car.CarThreeLevelCyclePolicyTest \
            --tests dezz.status.widget.car.GeelyClimateControlReliabilityTest \
            --tests dezz.status.widget.launcher.climate.ClimateLevelCyclePlannerTest \
            --tests dezz.status.widget.launcher.climate.ClimateLevelCycleContractTest \
            --tests dezz.status.widget.launcher.LauncherGlobalElementContractTest \
            --tests dezz.status.widget.launcher.LauncherActionsPanelEditorContractTest \
            --tests dezz.status.widget.launcher.navigation.NavigationPanelEditorContractTest \
            --tests dezz.status.widget.launcher.media.MediaPanelInteractionContractTest \
            --tests dezz.status.widget.launcher.MediaAutoResumeContractTest \
            --tests dezz.status.widget.launcher.VectorIconQualityContractTest \
            --tests dezz.status.widget.phone.PhoneWidgetServiceIntegrationContractTest \
            --tests dezz.status.widget.settings.SettingsHubRuntimeContractTest \
            --tests dezz.status.widget.settings.LauncherShortcutSettingsGridContractTest

      - name: Compile complete unsigned geelyRelease APK
        shell: bash
        env:
          ALLOW_UNSIGNED_RELEASE: 'true'
          VERSION_NAME: 'v2.8.2-ha1209'
          VERSION_CODE: '208021209'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache --max-workers=1 \
            assembleGeelyRelease

      - name: Upload exact unsigned Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ha1209-unsigned-release
          path: app/build/outputs/apk/geely/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Pack official Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/android-build-tools-36"
          mkdir -p "$tools/lib" "$tools/lib64"
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$tools/lib/"
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" "$tools/"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" "$tools/lib64/"

      - name: Upload official Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: ha1209-android-build-tools
          path: ${{ runner.temp }}/android-build-tools-36
          if-no-files-found: error
          retention-days: 1
