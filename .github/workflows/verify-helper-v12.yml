name: Verify iPhone Helper v12

on:
  push:
    branches:
      - 'release/kx11-ancs-helper-v12'
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v12/**'
      - '.github/workflows/verify-helper-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    name: Compile Helper v12 without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project settings
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v12/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings >/tmp/helper-v12-build-settings.txt
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper' \
            /tmp/helper-v12-build-settings.txt
          grep -q 'MARKETING_VERSION = 12.0' /tmp/helper-v12-build-settings.txt
          grep -q 'CURRENT_PROJECT_VERSION = 12' /tmp/helper-v12-build-settings.txt

      - name: Compile Helper v12
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v12/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/KX11ANCSHelperProducts" \
            OBJROOT="$RUNNER_TEMP/KX11ANCSHelperIntermediates" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify selectable single-route architecture
        run: |
          set -euo pipefail
          source=ios/KX11-iPhone-ANCS-Helper-v12/KX11ANCSHelper/ViewController.swift
          plist=ios/KX11-iPhone-ANCS-Helper-v12/KX11ANCSHelper/Info.plist
          grep -q 'case peripheral = 0' "$source"
          grep -q 'UISegmentedControl(items: \["Peripheral", "Central"\])' "$source"
          grep -q 'CBConnectPeripheralOptionRequiresANCS: true' "$source"
          grep -q 'kCBConnectOptionEnableAutoReconnect' "$source"
          grep -q 'stopAllBleRoutes()' "$source"
          grep -q 'Data("PAIR".utf8)' "$source"
          grep -q 'readValue(for: secure)' "$source"
          ! grep -q 'CBConnectPeripheralOptionEnableTransportBridgingKey' "$source"
          grep -q '<string>bluetooth-central</string>' "$plist"
          grep -q '<string>bluetooth-peripheral</string>' "$plist"
