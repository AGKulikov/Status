name: Verify Alice repeat recovery
on:
  push:
    branches: ['fix/alice-music-20261107']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: ./gradlew testGeelyDebugUnitTest --tests '*NativeAliceCoordinatorTest' --tests '*AliceMusicResumeTest' --tests '*AliceVoiceContinuationTest' --no-daemon --no-configuration-cache
      - run: bash tools/build_navigation_patch_dex.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alice-repeat-tests
          path: app/build/test-results/**
