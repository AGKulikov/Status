name: Verify media action assignments
on:
  push:
    branches: ['feature/media-actions-20261024']
    paths: ['app/**', 'tools/**', '.github/workflows/verify-media-actions.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION_NAME: '3.3.7'
      VERSION_CODE: '208021370'
      ALLOW_UNSIGNED_RELEASE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Pinned updater fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/natro-updater-fixture"
          gh release download natro-v3.2.5 --repo "$GITHUB_REPOSITORY" --pattern Natro-3.2.5-signed.apk --dir "$RUNNER_TEMP/natro-updater-fixture"
          echo "d3fed86ca73c76d1ff10eb3a89a22a731abc50df33ab1782e0986aa164a2daf6  $RUNNER_TEMP/natro-updater-fixture/Natro-3.2.5-signed.apk" | sha256sum -c -
          echo "NATRO_UPDATER_FIXTURE_APK=$RUNNER_TEMP/natro-updater-fixture/Natro-3.2.5-signed.apk" >> "$GITHUB_ENV"
      - name: Compile and test Android sources
        run: |
          python3 tools/check_backup_inventory.py
          ./gradlew testGeelyDebugUnitTest --no-daemon --no-configuration-cache --max-workers=2
      - name: Replay delivery policies
        run: python3 -m unittest tools.tests.test_media_delivery_recovery tools.tests.test_media_oem_controls -v
