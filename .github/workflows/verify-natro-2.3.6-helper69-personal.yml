name: Verify Natro 2.3.6 and Helper 69 Personal Team

on:
  push:
    branches: ['release/natro-2.3.6-helper69']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android tests and unsigned release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      VERSION_NAME: '2.3.6'
      VERSION_CODE: '208021260'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build
        env:
          ALLOW_UNSIGNED_RELEASE: 'true'
        run: ./gradlew testGeelyDebugUnitTest assembleGeelyRelease --no-daemon
      - name: Verify exact 2.3.6 notification and cold-start contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "if (version == '2.3.6')" build.gradle
          grep -Fq 'return 208021260' build.gradle
          grep -Fq 'STARTUP_QUIET_MS = 3_000L' \
            app/src/main/java/dezz/status/widget/phone/transport/v2/AndroidCentralRoute.java
          grep -Fq 'REGISTERED_GATT_RETIRE_SETTLE_MS = 2_000L' \
            app/src/main/java/dezz/status/widget/phone/transport/v2/android/AndroidCentralTransportV2.java
          grep -Fq 'gatt_retirement_settle phase=armed' \
            app/src/main/java/dezz/status/widget/phone/transport/v2/android/AndroidCentralTransportV2.java
          grep -Fq 'TELEMETRY_INITIAL_REFRESH_MS = 100L' \
            app/src/main/java/dezz/status/widget/phone/transport/v2/android/AndroidCentralTransportV2.java
          grep -Fq 'decoded item ready; category=' \
            app/src/main/java/dezz/status/widget/phone/PhoneConnectorController.java
          ! grep -Fq 'APP_DISPLAY_NAME_WAIT_TIMEOUT_MS' \
            app/src/main/java/dezz/status/widget/phone/PhoneConnectorController.java
          grep -Fq 'PROPERTY_DISPLAY_SWITCH_STATUS = 29021' \
            app/src/main/java/dezz/status/widget/car/EcarxExternalOverlayPolicy.java
          grep -Fq 'PROPERTY_VISION_IMAGE_MODE = 29043' \
            app/src/main/java/dezz/status/widget/car/EcarxExternalOverlayPolicy.java
          grep -Fq 'PROPERTY_PARKING_DISTANCE_CONTROL_STATUS = 28995' \
            app/src/main/java/dezz/status/widget/car/EcarxExternalOverlayPolicy.java
          grep -Fq 'setPhoneExternalOverlayActive(phoneVehicleOverlayActive)' \
            app/src/main/java/dezz/status/widget/WidgetService.java
          grep -Fq 'phoneExternalOverlayDeadlineBypass = true' \
            app/src/main/java/dezz/status/widget/WidgetService.java
          grep -Fq 'markPhoneLowBatteryAlertPresented' \
            app/src/main/java/dezz/status/widget/WidgetService.java
          ! grep -Fq 'ExternalOverlayWindowPolicy' \
            app/src/main/java/dezz/status/widget/WidgetAccessibilityService.java
          test ! -e app/src/main/java/dezz/status/widget/phone/ExternalOverlayWindowPolicy.java
          grep -Fq 'YANDEX_BROWSER_RETRY_COOLDOWN_MS = 10_000L' \
            app/src/main/java/dezz/status/widget/launcher/MediaAutoResumeController.java
          grep -Fq '!isUsablePlaySession(state)' \
            app/src/main/java/dezz/status/widget/launcher/MediaResumeCommand.java
          grep -Fq 'route=exact_receiver_browser_race' \
            app/src/main/java/dezz/status/widget/launcher/MediaResumeCommand.java
          grep -Fq 'route=waiting_for_exact_session' \
            app/src/main/java/dezz/status/widget/launcher/MediaResumeCommand.java
          grep -Fq 'MAIN.postDelayed(keyUp, keyUpDelayMs)' \
            app/src/main/java/dezz/status/widget/launcher/MediaResumeCommand.java
          ! grep -Fq 'SystemClock.sleep' \
            app/src/main/java/dezz/status/widget/launcher/MediaResumeCommand.java
          ! grep -Fq 'startService(' \
            app/src/main/java/dezz/status/widget/launcher/YandexMusicBrowserStarter.java
          test -z "$(find app ios -type f \( -name '*.p8' -o -name 'AuthKey_*.p8' \) \
            -print -quit)"
          APK=$(find app/build/outputs/apk/geely/release -name '*.apk' -print -quit)
          test -n "$APK"
          mv "$APK" "$RUNNER_TEMP/Natro-2.3.6-unsigned-release.apk"
      - name: Upload Android candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Natro-2.3.6-unsigned-release
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/Natro-2.3.6-unsigned-release.apk

  helper:
    name: Helper 69 unchanged Personal Team companion
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Replay portable Helper contracts
        run: ios/KX11-iPhone-ANCS-Helper-v69-personal/verify-v69-personal-contract.sh
      - name: Compile unsigned simulator app and extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v69-personal/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Release \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/Helper69PersonalProducts" \
            OBJROOT="$RUNNER_TEMP/Helper69PersonalIntermediates" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP="$RUNNER_TEMP/Helper69PersonalProducts/Release-iphonesimulator/"
          APP="${APP}KX11ANCSHelper.app"
          test -d "$APP/PlugIns/NatroLiveActivityExtension.appex"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" \
            = '69.0'
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = '69'

  sign-verify:
    name: Sign verified APK with the stable update certificate
    needs: android
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      VERSION_NAME: '2.3.6'
      VERSION_CODE: '208021260'
      PACKAGE_NAME: 'ru.natro.statuswidget'
      STABLE_CERT_SHA256: '6e9855aedc008bbdd8a7fbf3f490be07f964b7ac658a837a1592647a08365c75'
      BUILD_TOOLS_VERSION: '36.0.0'
    steps:
      - name: Download verified unsigned candidate without repository code
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Natro-2.3.6-unsigned-release
          path: ${{ runner.temp }}/natro-2.3.6-signing
      - name: Install exact Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "build-tools;${BUILD_TOOLS_VERSION}"
      - name: Receive exact encrypted signing bundle when Actions secrets are unavailable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_BRANCH: 'release/natro-2.3.6-helper69'
          SIGNING_BUNDLE_SHA256: '4fb34ee8aed62dad3896d7aa6240d4066ec9b6ef3da5459bca9d7d1c4c3b7fc0'
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if test -n "${KEYSTORE_BASE64:-}" && test -n "${KEY_PASSWORD:-}"; then
            echo 'Complete GitHub Actions signing secrets are configured'
            exit 0
          fi
          if test -n "${KEYSTORE_BASE64:-}" || test -n "${KEY_PASSWORD:-}"; then
            echo 'Signing credentials must be supplied completely or omitted completely' >&2
            exit 1
          fi
          unset KEYSTORE_BASE64 KEY_PASSWORD
          umask 077
          TRANSPORT="$RUNNER_TEMP/natro-2.3.6-signing-transport"
          SIGNING="$RUNNER_TEMP/natro-2.3.6-signing-material"
          mkdir -p "$TRANSPORT/chunks" "$SIGNING"
          PRIVATE="$TRANSPORT/private.pem"
          PUBLIC="$TRANSPORT/public.pem"
          ENCRYPTED="$TRANSPORT/signing-bundle.enc"
          ARCHIVE="$TRANSPORT/signing-bundle.tar.gz"
          PREFIX="natro236-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PUBLIC_PATH="release-handoff/${PREFIX}.pub"
          ENCRYPTED_PATH="release-handoff/${PREFIX}.enc"

          cleanup_transport() {
            find "$TRANSPORT/chunks" -type f -exec shred -u -- {} + 2>/dev/null || true
            shred -u -- "$PRIVATE" "$PUBLIC" "$ENCRYPTED" "$ARCHIVE" \
              "$TRANSPORT/encrypted.json" 2>/dev/null || true
          }
          trap cleanup_transport EXIT

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out "$PRIVATE" 2>/dev/null
          openssl pkey -in "$PRIVATE" -pubout -out "$PUBLIC"
          PUBLIC_CONTENT=$(base64 -w0 "$PUBLIC")
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${PUBLIC_PATH}" \
            -f message="ci: publish ephemeral Natro 2.3.6 transport key [skip ci]" \
            -f content="$PUBLIC_CONTENT" \
            -f branch="$HANDOFF_BRANCH" >/dev/null
          echo "::notice title=Natro 2.3.6 encrypted handoff::Waiting for ${ENCRYPTED_PATH}"

          for _ in $(seq 1 120); do
            if gh api \
                "repos/${GITHUB_REPOSITORY}/contents/${ENCRYPTED_PATH}?ref=${HANDOFF_BRANCH}" \
                > "$TRANSPORT/encrypted.json" 2>/dev/null; then
              jq -r '.content' "$TRANSPORT/encrypted.json" \
                | tr -d '\n' | base64 --decode > "$ENCRYPTED"
              break
            fi
            sleep 5
          done
          test -s "$ENCRYPTED" || {
            echo 'Timed out waiting for the encrypted signing handoff' >&2
            exit 1
          }
          test $(( $(stat -c '%s' "$ENCRYPTED") % 512 )) -eq 0
          split -b 512 -d -a 3 "$ENCRYPTED" "$TRANSPORT/chunks/chunk-"
          : > "$ARCHIVE"
          for chunk in "$TRANSPORT"/chunks/chunk-*; do
            openssl pkeyutl -decrypt -inkey "$PRIVATE" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256 \
              -in "$chunk" >> "$ARCHIVE"
          done
          test "$(sha256sum "$ARCHIVE" | awk '{print $1}')" \
            = "$SIGNING_BUNDLE_SHA256"
          tar -tzf "$ARCHIVE" | awk \
            'BEGIN { ok=1 } /^\// || /(^|\/)\.\.($|\/)/ { ok=0 } END { exit ok ? 0 : 1 }'
          tar -xzf "$ARCHIVE" -C "$SIGNING" \
            --no-same-owner --no-same-permissions
          chmod 600 "$SIGNING"/*
          test -s "$SIGNING/status-widget-ha-update.jks"
          test -s "$SIGNING/status-widget-ha-update.pass"
          IFS= read -r BUNDLE_PASSWORD \
            < "$SIGNING/status-widget-ha-update.pass"
          test -n "$BUNDLE_PASSWORD"
          export BUNDLE_PASSWORD
          BUNDLE_CERT=$(keytool -J-Duser.language=en -J-Duser.country=US \
            -list -v -keystore "$SIGNING/status-widget-ha-update.jks" \
            -alias status-widget-ha -storepass:env BUNDLE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | tr -d ':\r' | tr 'A-F' 'a-f' | head -n 1)
          unset BUNDLE_PASSWORD
          test "$BUNDLE_CERT" = "$STABLE_CERT_SHA256"
          touch "$SIGNING/verified.ready"
      - name: Sign only the verified handoff and verify its identity
        id: signed
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/natro-2.3.6-signing"
          UNSIGNED="$WORK/Natro-2.3.6-unsigned-release.apk"
          KEYSTORE="$RUNNER_TEMP/natro-2.3.6-stable-update.jks"
          SIGNED="$WORK/Natro-2.3.6-signed-stable-update.apk"
          SIGNING="$RUNNER_TEMP/natro-2.3.6-signing-material"
          PASSWORD_FILE=''
          cleanup_files=("$KEYSTORE")
          trap 'shred -u -- "${cleanup_files[@]}" 2>/dev/null || true' EXIT
          if test -n "${KEYSTORE_BASE64:-}" && test -n "${KEY_PASSWORD:-}"; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          elif test -z "${KEYSTORE_BASE64:-}" && test -z "${KEY_PASSWORD:-}"; then
            test -f "$SIGNING/verified.ready"
            KEYSTORE="$SIGNING/status-widget-ha-update.jks"
            PASSWORD_FILE="$SIGNING/status-widget-ha-update.pass"
            cleanup_files=("$KEYSTORE" "$PASSWORD_FILE")
            IFS= read -r KEY_PASSWORD < "$PASSWORD_FILE"
          else
            echo 'Signing credentials must be supplied completely or by encrypted handoff' >&2
            exit 1
          fi
          KEY_ALIAS=${KEY_ALIAS:-status-widget-ha}
          test -n "$KEY_PASSWORD"
          export KEY_PASSWORD
          test -s "$UNSIGNED"
          CERT=$(keytool -J-Duser.language=en -J-Duser.country=US \
            -list -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
            -storepass:env KEY_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | tr -d ':\r' | tr 'A-F' 'a-f' | head -n 1)
          test "$CERT" = "$STABLE_CERT_SHA256"
          TOOLS="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          if "$TOOLS/apksigner" verify "$UNSIGNED" >/dev/null 2>&1; then
            echo 'Unsigned handoff unexpectedly contains a valid signature' >&2
            exit 1
          fi
          "$TOOLS/zipalign" -c -P 16 -v 4 "$UNSIGNED" >/dev/null
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --min-sdk-version 28 \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$UNSIGNED"
          VERIFY=$($TOOLS/apksigner verify --verbose --print-certs "$SIGNED")
          printf '%s\n' "$VERIFY" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
          printf '%s\n' "$VERIFY" | grep -F 'Number of signers: 1'
          printf '%s\n' "$VERIFY" | grep -F \
            "Signer #1 certificate SHA-256 digest: ${STABLE_CERT_SHA256}"
          BADGING=$($TOOLS/aapt dump badging "$SIGNED")
          printf '%s\n' "$BADGING" | grep -F \
            "package: name='${PACKAGE_NAME}' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          printf '%s\n' "$BADGING" | grep -Fx "application-label:'Natro'"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED" >/dev/null
          sha256sum "$SIGNED" > "$WORK/Natro-2.3.6-signed-stable-update.apk.sha256"
      - name: Upload stable signed update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Natro-2.3.6-signed-stable-update
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/natro-2.3.6-signing/Natro-2.3.6-signed-stable-update.apk
            ${{ runner.temp }}/natro-2.3.6-signing/Natro-2.3.6-signed-stable-update.apk.sha256
