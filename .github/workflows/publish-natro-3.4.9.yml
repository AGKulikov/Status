name: Publish verified Natro 3.4.9 stable update

on:
  push:
    branches: ['release/natro-3.4.9']
    paths: ['.github/workflows/publish-natro-3.4.9.yml', 'docs/releases/3.4.9/**']

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-natro-v3.4.9
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AGKulikov/Status'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: 'cbe1644909fab2d94dec3045dd73ed172fde7371'
      SOURCE_TREE: '61059c7a19ca9ff0d7ff16e546e613cfbaaad2f0'
      BUILD_RUN: '43559635840'
      RELEASE_TAG: 'natro-v3.4.9'
      SIGNED_SHA256: '219ecf541014d050555178e5552592224915ba04cf22d3341ae536c5a5f69570'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Require exact successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" \
            | jq -e --arg source "$SOURCE_SHA" '.head_sha == $source and .status == "completed" and .conclusion == "success"'
          test "$(jq -r '.versionName' docs/releases/3.4.9/release-report.json)" = 3.4.9
          test "$(jq -r '.versionCode' docs/releases/3.4.9/release-report.json)" = 208021382
      - name: Download exact tested candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Natro-3.4.9-offline-signing-1
          run-id: 43559635840
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/natro349-candidate
      - name: Download matching signing verification tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Natro-3.4.9-signing-tools-1
          run-id: 43559635840
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/natro349-tools
      - name: Verify public offline-signature handoff without any signing key
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_apk_signature_handoff tools.tests.test_update_channel tools.tests.test_anr_evidence_replay tools.tests.test_music_bootstrap_replay -v
          OUT="$RUNNER_TEMP/natro349-release"
          mkdir "$OUT"
          cp docs/releases/3.4.9/release-report.json docs/releases/3.4.9/natro-update.json \
            docs/releases/3.4.9/signature-verification.txt "$OUT/"
          cp docs/releases/3.4.9/release-notes.md "$OUT/README_RU.md"
          python3 tools/apk_signature_handoff.py apply \
            --unsigned "$RUNNER_TEMP/natro349-candidate/Natro-3.4.9-unsigned.apk" \
            --patch docs/releases/3.4.9/signing-handoff.json \
            --output "$OUT/Natro-3.4.9-signed.apk"
          python3 tools/verify_offline_release_handoff.py \
            --candidate "$RUNNER_TEMP/natro349-candidate" --tools "$RUNNER_TEMP/natro349-tools" \
            --release "$OUT" --source "$SOURCE_SHA" --tree "$SOURCE_TREE" \
            --run "$BUILD_RUN" --signed-sha256 "$SIGNED_SHA256"
      - name: Checkout exact APK source for source archive
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: exact-apk-source
          persist-credentials: false
      - name: Package exact public source and checksums
        run: |
          set -euo pipefail
          test "$(git -C exact-apk-source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C exact-apk-source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          OUT="$RUNNER_TEMP/natro349-release"
          git -C exact-apk-source archive --format=tar.gz --prefix=Natro-3.4.9-source/ \
            --output="$OUT/Natro-3.4.9-source.tar.gz" HEAD
          cd "$OUT"
          sha256sum Natro-3.4.9-signed.apk natro-update.json release-report.json \
            signature-verification.txt README_RU.md Natro-3.4.9-source.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Retain exact verified signed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Natro-3.4.9-verified-stable-files
          path: ${{ runner.temp }}/natro349-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Stage Natro draft and verify every asset before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/natro349-release"
          VERIFY="$RUNNER_TEMP/natro349-release-readback"
          # Do not overwrite an existing release or assets. A failed draft can be
          # resumed only after matching its source and every byte below.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              | jq -e --arg source "$SOURCE_SHA" \
                '.draft == true and .target_commitish == $source and (.assets | length) == 7'
          else
            gh release create "$RELEASE_TAG" "$OUT/"* --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --draft --title "Natro 3.4.9" \
              --notes-file docs/releases/3.4.9/release-notes.md
          fi
          mkdir "$VERIFY"
          gh release download "$RELEASE_TAG" --dir "$VERIFY" --repo "$GITHUB_REPOSITORY"
          test "$(find "$VERIFY" -maxdepth 1 -type f | wc -l)" -eq 7
          (cd "$VERIFY" && sha256sum -c SHA256SUMS.txt)
          for name in Natro-3.4.9-signed.apk natro-update.json release-report.json signature-verification.txt README_RU.md Natro-3.4.9-source.tar.gz SHA256SUMS.txt; do
            cmp "$OUT/$name" "$VERIFY/$name"
          done
          echo 'Natro draft verified; stable promotion waits for both companion APKs.'
      - name: Stage companion manifests and verification reports as drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DOC=docs/releases/3.4.9
          for APP in navigator music; do
            if [ "$APP" = navigator ]; then
              TAG=natro-navigator-v3.4.9
              TARGET="$SOURCE_SHA"
              TITLE='Navigator 30.3.0 / Natro 3.4.9'
            else
              TAG=natro-music-v4
              TARGET=1ac4f00dfe03448198429de1183136211efe093f
              TITLE='Yandex Music 2026.10.2 / Natro 4'
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | jq -e --arg source "$TARGET" '.target_commitish == $source'
            else
              gh release create "$TAG" "$DOC/$APP-update.json" "$DOC/$APP-release-report.json" "$DOC/$APP-signature-verification.txt" \
                --repo "$GITHUB_REPOSITORY" --target "$TARGET" --draft --title "$TITLE" --notes-file "$DOC/$APP-release-notes.md"
            fi
          done
      - name: Verify uploaded companion APKs then publish all three channels
        if: ${{ hashFiles('docs/releases/3.4.9/publish-ready.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DOC=docs/releases/3.4.9
          for APP in navigator music; do
            if [ "$APP" = navigator ]; then TAG=natro-navigator-v3.4.9; else TAG=natro-music-v4; fi
            VERIFY="$RUNNER_TEMP/$APP-channel-readback"
            mkdir "$VERIFY"
            gh release download "$TAG" --dir "$VERIFY" --repo "$GITHUB_REPOSITORY"
            test "$(find "$VERIFY" -maxdepth 1 -type f | wc -l)" -eq 4
            for NAME in "$APP-update.json" "$APP-release-report.json" "$APP-signature-verification.txt"; do cmp "$DOC/$NAME" "$VERIFY/$NAME"; done
            python3 - "$APP" "$VERIFY" "$RUNNER_TEMP/natro349-tools" <<'VERIFY_PY'
          import sys,json,hashlib,re,subprocess
          from pathlib import Path
          from urllib.parse import urlsplit
          from tools.verify_kx11_navigation_pair import verify_signer,verify_zipalign
          app,folder,sdk=sys.argv[1],Path(sys.argv[2]),Path(sys.argv[3])
          manifest=json.loads((folder/(app+'-update.json')).read_text())
          apk=folder/Path(urlsplit(manifest['url']).path).name
          assert apk.stat().st_size==manifest['size']
          digest=hashlib.sha256()
          with apk.open('rb') as stream:
              for chunk in iter(lambda:stream.read(1048576),b''):digest.update(chunk)
          assert digest.hexdigest()==manifest['sha256']
          for name in ('apksigner','aapt','zipalign'):(sdk/name).chmod(0o755)
          verify_signer(sdk/'apksigner',apk,('v2','v3'));verify_zipalign(sdk/'zipalign',apk)
          subprocess.run([str(sdk/'apksigner'),'verify','--min-sdk-version','28','--max-sdk-version','28',str(apk)],check=True)
          badging=subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(apk)],text=True)
          match=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging)
          assert match and match[1]==manifest['package'] and int(match[2])==manifest['versionCode'] and match[3]==manifest['versionName']
          print(app+' public draft readback: size/hash/package/version/stable signer/API28/zipalign PASS')
          VERIFY_PY
          done
          gh release edit natro-navigator-v3.4.9 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh release edit natro-music-v4 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            | jq -e --arg source "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $source'
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            | jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false and (.assets | length) == 7'
          for TAG in natro-navigator-v3.4.9 natro-music-v4; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | jq -e '.draft == false and .prerelease == false and (.assets | length) == 4'
          done
