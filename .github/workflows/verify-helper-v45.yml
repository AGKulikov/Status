name: Verify iPhone Helper v45 · HA1211

on:
  push:
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v41/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v42/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v43/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v44/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v45/**'
      - '.github/workflows/verify-helper-v45.yml'
  pull_request:
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v41/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v42/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v43/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v44/**'
      - 'ios/KX11-iPhone-ANCS-Helper-v45/**'
      - '.github/workflows/verify-helper-v45.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    name: Compile Helper v45 for HA1211 without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v45/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings >"$RUNNER_TEMP/helper-v45-build-settings.txt"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper' \
            "$RUNNER_TEMP/helper-v45-build-settings.txt"
          grep -q 'MARKETING_VERSION = 45.0' "$RUNNER_TEMP/helper-v45-build-settings.txt"
          grep -q 'CURRENT_PROJECT_VERSION = 45' "$RUNNER_TEMP/helper-v45-build-settings.txt"

      - name: Compile Helper v45
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v45/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/KX11ANCSHelperProducts" \
            OBJROOT="$RUNNER_TEMP/KX11ANCSHelperIntermediates" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify HA1211 P/L/A-Q and preserved v44 through v41 contracts
        shell: bash
        run: |
          set -euo pipefail
          sh ios/KX11-iPhone-ANCS-Helper-v45/verify-v45-contract.sh

      - name: Stage exact unsigned build and source contract
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/KX11ANCSHelperProducts/Debug-iphonesimulator/KX11ANCSHelper.app"
          test -d "$app"
          test -f "$app/KX11ANCSHelper"
          test -f ios/KX11-iPhone-ANCS-Helper-v45/KX11ANCSHelper/AppDelegate.swift
          test -f ios/KX11-iPhone-ANCS-Helper-v45/KX11ANCSHelper/ViewController.swift
          test -x ios/KX11-iPhone-ANCS-Helper-v45/verify-v45-contract.sh
          for version in 41 42 43 44; do
            test -f "ios/KX11-iPhone-ANCS-Helper-v$version/verify-v$version-contract.sh"
          done

      - name: Upload Helper v45 HA1211 build and exact source
        uses: actions/upload-artifact@v4
        with:
          name: KX11-ANCS-Helper-v45-HA1211-unsigned-simulator
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/KX11ANCSHelperProducts/Debug-iphonesimulator/KX11ANCSHelper.app
            ios/KX11-iPhone-ANCS-Helper-v41
            ios/KX11-iPhone-ANCS-Helper-v42
            ios/KX11-iPhone-ANCS-Helper-v43
            ios/KX11-iPhone-ANCS-Helper-v44
            ios/KX11-iPhone-ANCS-Helper-v45
