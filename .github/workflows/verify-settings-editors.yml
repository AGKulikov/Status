name: Verify complete settings redesign
on:
  push:
    branches: ['feature/natro-settings-complete-20261004', 'feature/natro-map-trip-audit-20260912']
    paths: ['app/**', 'tools/audit_settings_editors.py', 'docs/settings/**', '.github/workflows/verify-settings-editors.yml']
permissions:
  contents: read
concurrency:
  group: settings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editors:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VERSION_NAME: '3.0.3'
      VERSION_CODE: '208021336'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Source inventory
        run: python3 tools/audit_settings_editors.py --check
      - name: Focused icon import and recovery regressions
        timeout-minutes: 5
        run: |
          ./gradlew testGeelyDebugUnitTest --no-daemon --max-workers=2 \
            --tests 'dezz.status.widget.phone.LocalImage*Test' \
            --tests 'dezz.status.widget.HudLcaPatchMessageTest' \
            --tests 'dezz.status.widget.settings.SettingsApplyJournalTest'
      - name: Android interactions and regression tests
        timeout-minutes: 10
        run: |
          ./gradlew testGeelyDebugUnitTest --no-daemon --max-workers=2 &
          settings_task=$!
          (
            for sample in 1 2 3 4 5 6; do sleep 30; done
            mkdir -p app/build/settings-diagnostics
            jps -l | while read -r settings_pid settings_main; do
              if [[ "$settings_main" == *GradleWorkerMain* ]]; then
                jstack -l "$settings_pid" > "app/build/settings-diagnostics/worker-$settings_pid.txt" || true
              fi
            done
          ) &
          settings_watchdog=$!
          set +e
          wait "$settings_task"
          settings_result=$?
          kill "$settings_watchdog" 2>/dev/null || true
          exit "$settings_result"
      - name: Interaction reports and rendered screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settings-ui-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/settings-screenshots/**
            app/build/settings-diagnostics/**
          retention-days: 14
