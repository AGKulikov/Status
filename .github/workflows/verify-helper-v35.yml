name: Verify iPhone Helper v35

on:
  push:
    branches:
      - 'release/v2.8.2-ha1198'
      - 'work/ha1198-auto-recovery'
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v35/**'
      - '.github/workflows/verify-helper-v35.yml'
  pull_request:
    paths:
      - 'ios/KX11-iPhone-ANCS-Helper-v35/**'
      - '.github/workflows/verify-helper-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    name: Compile Helper v35 without signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v35/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings >"$RUNNER_TEMP/helper-v35-build-settings.txt"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ru.natro.kx11ancshelper' \
            "$RUNNER_TEMP/helper-v35-build-settings.txt"
          grep -q 'MARKETING_VERSION = 35.0' "$RUNNER_TEMP/helper-v35-build-settings.txt"
          grep -q 'CURRENT_PROJECT_VERSION = 35' "$RUNNER_TEMP/helper-v35-build-settings.txt"

      - name: Compile Helper v35
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/KX11-iPhone-ANCS-Helper-v35/KX11ANCSHelper.xcodeproj \
            -target KX11ANCSHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/KX11ANCSHelperProducts" \
            OBJROOT="$RUNNER_TEMP/KX11ANCSHelperIntermediates" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify powered-state and namespace recovery contract
        shell: bash
        run: |
          set -euo pipefail
          source=ios/KX11-iPhone-ANCS-Helper-v35/KX11ANCSHelper/ViewController.swift
          grep -q 'KX11 ANCS HELPER v35' "$source"
          grep -q 'CBConnectPeripheralOptionRequiresANCS: true' "$source"
          grep -q 'centralConnectTimeout: TimeInterval = 15' "$source"
          grep -q 'private func stopCentralScanSafely' "$source"
          grep -q 'private func cancelCentralConnectionSafely' "$source"
          grep -q 'private func flushDeferredCentralCommands' "$source"
          grep -q 'generation == centralRejectedNamespaceGeneration' "$source"
          grep -q 'Central restore сохранён; BLE-команды отложены до poweredOn' "$source"
          test "$(grep -Fc 'centralManager.connect(peripheral, options: options)' "$source")" -eq 1
          restore="$(sed -n '/willRestoreState dict/,/didDiscover peripheral/p' "$source")"
          ! grep -q 'central\.stopScan()\|central\.cancelPeripheralConnection' <<<"$restore"
          grep -q '_ = controller.view' \
            ios/KX11-iPhone-ANCS-Helper-v35/KX11ANCSHelper/AppDelegate.swift
