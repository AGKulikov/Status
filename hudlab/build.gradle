apply plugin: 'com.android.application'

android {
    namespace "dezz.status.hudlab"

    compileSdkVersion 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        // Keep the 0.28 package so 0.29 installs as an in-place update.
        applicationId "dezz.status.hudlab26"
        minSdk 28
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 29
        versionName "0.29"
        setProperty("archivesBaseName", "hud-lab-${versionName}")
    }

    sourceSets {
        main {
            // Reuse the already-audited local ADB/Telnet transports from the main application.
            // HUD Lab supplies its own small coordinator and deliberately excludes the main
            // application's permission-grant orchestration.
            java.srcDir '../app/src/main/java/dezz/status/widget/shell'
            java.exclude '**/PrivilegedShell.java'
            // The previous experimental auto-repeat implementation must not be packaged.
            java.exclude '**/HudModeFallbackBootReceiver.java'
            java.exclude '**/HudModeFallbackService.java'
            java.exclude '**/HudModeEnforcementPolicy.java'
            java.exclude '**/HudModeFallbackStore.java'
        }
        test {
            java.exclude '**/HudModeEnforcementPolicyTest.java'
            java.exclude '**/HudModeFallbackStoreTest.java'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: '../keystore.jks')
            storePassword System.getenv("KEY_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: "status-widget-ha"
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ALLOW_UNSIGNED_RELEASE") != "true") {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            if (file('../keystore.jks').exists() && System.getenv("KEY_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "hud-lab-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // The same vendor SDK used by Status Widget HA. HUD Lab has a separate package and process.
    implementation files('../app/libs/geely/ecarx-adaptapi.jar')
    implementation libs.adblib
    testImplementation 'junit:junit:4.13.2'
}
