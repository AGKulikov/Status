apply plugin: 'com.android.application'

android {
    namespace "dezz.status.hudlab"

    compileSdkVersion 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "dezz.status.hudlab10"
        minSdk 28
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 15
        versionName "0.15"
        setProperty("archivesBaseName", "hud-lab-${versionName}")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: '../keystore.jks')
            storePassword System.getenv("KEY_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: "status-widget-ha"
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ALLOW_UNSIGNED_RELEASE") != "true") {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            if (file('../keystore.jks').exists() && System.getenv("KEY_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "hud-lab-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // The same vendor SDK used by Status Widget HA. HUD Lab has a separate package and process.
    implementation files('../app/libs/geely/ecarx-adaptapi.jar')
    testImplementation 'junit:junit:4.13.2'
}
